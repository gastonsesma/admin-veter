<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇦🇷 ADMIN-VTR-ARG</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2374ACDF'/><rect y='10.5' width='32' height='11' fill='white'/></svg>"><rect width='100' height='100' rx='22' fill='%23212121'/><line x1='25' y1='32' x2='25' y2='44' stroke='white' stroke-width='8' stroke-linecap='round'/><line x1='19' y1='38' x2='31' y2='38' stroke='white' stroke-width='8' stroke-linecap='round'/><line x1='57' y1='25' x2='69' y2='37' stroke='white' stroke-width='8' stroke-linecap='round'/><line x1='69' y1='25' x2='57' y2='37' stroke='white' stroke-width='8' stroke-linecap='round'/><line x1='19' y1='65' x2='31' y2='65' stroke='white' stroke-width='8' stroke-linecap='round'/><line x1='55' y1='62' x2='71' y2='62' stroke='white' stroke-width='8' stroke-linecap='round'/><line x1='55' y1='72' x2='71' y2='72' stroke='white' stroke-width='8' stroke-linecap='round'/></svg>">
<style>
:root{--bg:#F4FAFE;--surface:#fff;--border:#CBE9F6;--pri:#0099CC;--pri-l:#D6F0FA;--pri-d:#006B99;--text:#0A2233;--t2:#2A5068;--t3:#5B8BA8;--yellow:#FFFBEA;--radius:8px;--rlg:12px;--shadow:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
header{background:#006B99;color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:12px;height:52px;position:sticky;top:0;z-index:10}
header h1{font-size:15px;font-weight:600}
#sync{background:rgba(255,255,255,.2);border-radius:20px;font-size:11px;padding:3px 10px;transition:background .3s}
nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:center;padding:10px 16px;gap:6px;overflow-x:auto;position:sticky;top:52px;z-index:9}
nav button{background:none;border:1px solid transparent;border-radius:20px;color:var(--t2);cursor:pointer;font:13px/1 inherit;font-weight:500;padding:7px 18px;white-space:nowrap;transition:all .15s}
nav button.on{background:#006B99;border-color:#006B99;color:#fff;font-weight:600}
nav button:hover:not(.on){background:var(--bg);border-color:var(--border);color:var(--text)}
main{max-width:1280px;margin:0 auto;padding:20px 24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.ch{background:#F7F8FA;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cb{padding:14px 16px}
label{display:block;font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font:14px/1.4 inherit;color:var(--text);background:var(--surface);outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:#0099CC;box-shadow:0 0 0 3px rgba(0,153,204,.15)}
input[type=number]{-moz-appearance:textfield;text-align:right;font-feature-settings:"tnum"}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.btn{border:none;border-radius:var(--radius);cursor:pointer;font:13px/1 inherit;font-weight:500;padding:8px 16px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.bp{background:#0099CC;color:#fff}.bp:hover{background:#006B99}
.bg{background:transparent;border:1px solid var(--border);color:var(--t2)}.bg:hover{background:var(--bg)}
.bd{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;cursor:pointer;border-radius:var(--radius);padding:5px 9px;font-size:12px}.bd:hover{background:#FEE2E2}
.bi{background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--t3);cursor:pointer;padding:5px 9px;font-size:14px;transition:all .15s}.bi:hover{background:var(--bg);color:var(--text)}
.badge{border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.4px;padding:3px 9px;white-space:nowrap}
.bg-bmetro{background:#DCFCE7;color:#15803D}.bg-usa{background:#DBEAFE;color:#1D4ED8}.bg-futsal{background:#BBF7D0;color:#064E3B}.bg-ligafem{background:#F3E8FF;color:#7C3AED}.bg-primera{background:#A7F3D0;color:#064E3B}.bg-tenis{background:#FEF9C3;color:#854D0E}.bg-custom{background:#F1F5F9;color:#334155}
.cam-badge{background:#E0E7FF;color:#3730A3;border-radius:20px;font-size:10px;font-weight:600;padding:3px 8px;white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grol{display:grid;grid-template-columns:110px 1fr 105px;gap:8px;align-items:center;margin-bottom:9px}
.eq-grid{display:flex;flex-wrap:wrap}
.eq-item{padding:10px 14px;border-right:1px solid var(--border)}
.eq-item:last-child{border-right:none}
.eq-rol{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--t3);text-transform:uppercase;margin-bottom:3px}
.eq-nom{font-size:13px;font-weight:500}
.eq-mon{font-size:12px;color:var(--pri);font-feature-settings:"tnum";margin-top:1px}
/* Card B styles */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow);display:grid;grid-template-columns:5px 1fr}

.ptable-wrap{background:#FAFBFC;border:1px solid var(--border);border-radius:var(--rlg);overflow-x:auto;margin-bottom:16px}
.prow{border-bottom:1px solid var(--border);padding:9px 14px;text-transform:uppercase}
.prow:last-child{border-bottom:none}
.prow:hover{background:#F8FAFC}
.prow.newday{border-top:2px solid var(--border)}
.pline1{display:flex;align-items:center;gap:10px}
.ptime{font-size:11px;color:var(--t3);flex-shrink:0;width:95px;white-space:nowrap}
.pmatch{font-weight:700;font-size:16px;color:var(--t1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnum{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;width:96px;text-align:right;flex-shrink:0}
.pline2{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.ppill{display:flex;align-items:baseline;gap:4px;background:#F8FAFC;border:1px solid var(--border);border-radius:999px;padding:4px 10px;min-width:0}
.ppill .pdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ppill .prol{font-size:9px;font-weight:800;letter-spacing:.3px;color:var(--t3);text-transform:uppercase;flex-shrink:0}
.ppill .pnom{font-size:12.5px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ppill .pmon{font-size:10px;color:var(--t3);flex-shrink:0;margin-left:auto}
.pempty{border:1.5px dashed var(--border);border-radius:999px}
.r-dir .pdot{background:#1D4ED8} .r-asist .pdot{background:#0891B2} .r-prod .pdot{background:#7C3AED}
.r-cam .pdot{background:#D97706} .r-per .pdot{background:#DB2777} .r-mov .pdot{background:#0D9488}
.pcard-stripe{width:5px}
.pcard-body{padding:12px 16px}
.pcard-top{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin-bottom:10px}.pcard-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;overflow:hidden}.pcard-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px}
.pcard-num{font-size:11px;color:var(--t3);font-feature-settings:"tnum";font-weight:600}
.pcard-fecha{font-size:12px;color:var(--t3)}
.pcard-nombre{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-fin{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.pcard-fin-item{display:flex;flex-direction:column;background:#F7F8FA;border:1px solid var(--border);border-radius:8px;padding:5px 12px;min-width:100px;text-align:right}
.pcard-fin-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:1px}
.pcard-fin-val{font-size:14px;font-weight:700;font-feature-settings:"tnum"}
.pcard-eq{display:flex;flex-wrap:wrap;gap:6px}
.pcard-chip{background:#F7F8FA;border:1px solid var(--border);border-radius:6px;padding:5px 10px;display:flex;align-items:center;gap:8px}
.pcard-chip-rol{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);white-space:nowrap}
.pcard-chip-nom{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap}
.pcard-chip-mon{font-size:12px;color:#059669;font-weight:700;font-feature-settings:"tnum";white-space:nowrap;margin-left:auto}
.pcard-chip-sep{width:1px;background:var(--border);height:14px;flex-shrink:0}
.pcard-usa{display:inline-flex;align-items:center;gap:5px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:20px;padding:3px 10px;font-size:11px;color:#1D4ED8;font-weight:500}
.ptot{font-size:14px;font-weight:600;color:var(--pri-d);font-feature-settings:"tnum";white-space:nowrap}
.pi{font-size:12px;color:var(--t3)}
.pnom{font-size:14px;font-weight:500;flex:1;min-width:0}
.lrow{display:grid;grid-template-columns:55px 1fr 105px 90px;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border);align-items:center}
.lsub{background:var(--bg);border-top:1px solid var(--border);display:flex;justify-content:flex-end;padding:8px 18px;font-weight:600;color:var(--pri-d);font-feature-settings:"tnum";font-size:13px}
.ltot-bar{background:var(--pri-l);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.ltot-num{font-size:22px;font-weight:700;color:var(--pri-d);font-feature-settings:"tnum"}
.qlabel{background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);color:var(--t3);font-size:11px;font-weight:600;letter-spacing:.5px;padding:5px 18px;text-transform:uppercase}
.status{display:flex;align-items:center;gap:8px;font-size:12px;padding:8px 14px;border-radius:var(--radius);margin-bottom:14px}
.s-ok{background:var(--pri-l);color:var(--pri-d)}.s-err{background:#FEF2F2;color:#991B1B}.s-load{background:var(--yellow);color:#92400E}
.empty{text-align:center;padding:56px 20px;color:var(--t3)}
.empty svg{margin:0 auto 14px;display:block;opacity:.35}
.empty h3{font-size:16px;font-weight:500;color:var(--t2);margin-bottom:6px}
.empty p{font-size:13px}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mono{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
.tip{font-size:11px;color:var(--t3);margin-top:4px}
.ac-wrap{position:relative}
.ac-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.1);left:0;max-height:180px;overflow-y:auto;position:absolute;right:0;top:calc(100% + 3px);z-index:100}
.ac-item{cursor:pointer;padding:8px 12px;font-size:13px}
.ac-item:hover,.ac-item.sel{background:var(--pri-l);color:var(--pri-d)}
hr{border:none;border-top:1px solid var(--border);margin:20px 0}
code{background:var(--bg);padding:1px 6px;border-radius:4px;font-size:12px}
ol{padding-left:18px;line-height:2.2}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}.lrow{grid-template-columns:45px 1fr 85px}.lrol{display:none}}
@media print{header,nav,.btn,.bi,.bd,.print-hide{display:none!important}main{padding:0}.card{box-shadow:none}}
</style>
</head>
<body>
<script>
(function(){
  var PASS='Maradona.10';
  var ok=sessionStorage.getItem('veterAuth')===PASS;
  while(!ok){
    var input=prompt('Veter — Passphrase de acceso:');
    if(input===null){location.href='about:blank';throw new Error('cancelado');}
    if(input===PASS){sessionStorage.setItem('veterAuth',PASS);ok=true;}
    else alert('Passphrase incorrecta.');
  }
  window.VETER_TOKEN=PASS;
})();
</script>

<main id="main"></main>

<script>
const TIPOS_BASE=["B METRO","USA","FUTSAL","LIGA FEMENINA","PRIMERA C","TENIS"];
const TIPOS_CAM_BASE=["B METRO","FUTSAL","LIGA FEMENINA","PRIMERA C","TENIS"];
const TBADGE={"B METRO":"bg-bmetro","USA":"bg-usa","FUTSAL":"bg-futsal","LIGA FEMENINA":"bg-ligafem","PRIMERA C":"bg-primera","TENIS":"bg-tenis",
  "B MET":"bg-bmetro","UPSL":"bg-usa","UPSL1":"bg-usa","FUT FEM":"bg-ligafem","OTRO":"bg-custom"};
let TIPOS_COLORS={};
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const TODOS_ROLES=["DIRECTOR","ASISTENTE","PRODUCTOR","CAMARA 1","CAMARA 2","CAMARA 3","PERIODISTA 1","PERIODISTA 2","MOVILIDAD"];

// DIRECTOR stored as {1:x, 2:y, 3:z} for tipos with cameras
const TDEF={
  "B METRO":{DIRECTOR:{"1":75000,"2":85000,"3":95000},ASISTENTE:45000,"CAMARA 1":70000,"CAMARA 2":70000,"CAMARA 3":70000,MOVILIDAD:60000},
  "USA":{DIRECTOR:50000,PRODUCTOR:25000,"PERIODISTA 1":40000,"PERIODISTA 2":0},
  "FUTSAL":{DIRECTOR:{"1":75000,"2":85000,"3":95000},ASISTENTE:45000,"CAMARA 1":70000,"CAMARA 2":70000,MOVILIDAD:60000},
  "LIGA FEMENINA":{DIRECTOR:{"1":75000,"2":85000,"3":95000},ASISTENTE:45000,"CAMARA 1":70000,"CAMARA 2":70000,MOVILIDAD:60000},
  "PRIMERA C":{DIRECTOR:{"1":75000,"2":85000,"3":95000},"CAMARA 1":70000,"CAMARA 2":70000,MOVILIDAD:60000},
  "TENIS":{DIRECTOR:{"1":75000},ASISTENTE:45000,"CAMARA 1":70000,MOVILIDAD:60000}
};

// Tarifas de ingreso (lo que cobra Veter al cliente)
const TCLIENTE_DEF={
  "B METRO":{"1":390000,"2":750000,"3":1200000},
  "FUTSAL":{"1":390000,"2":750000,"3":1200000},
  "LIGA FEMENINA":{"1":390000,"2":750000,"3":1200000},
  "PRIMERA C":{"1":350000,"2":750000,"3":1200000},
  "TENIS":{"1":200000,"2":0,"3":0},
  "USA":0
};

// Dynamic — can be extended by user
let TIPOS=[...TIPOS_BASE];
let TIPOS_CAM=[...TIPOS_CAM_BASE];

function tipoUsesCam(tipo){return TIPOS_CAM.includes(tipo)}
function getBadge(tipo){return TBADGE[tipo]||'bg-custom'}
function getBadgeStyle(tipo){
  if(TBADGE[tipo])return'';
  const c=TIPOS_COLORS[tipo];
  if(!c)return'';
  return`background:${c}22;color:${c};border:1px solid ${c}44`;
}

function getRoles(tipo,camaras){
  const n=parseInt(camaras)||1;
  const fixed={
    "B METRO":["DIRECTOR","ASISTENTE","CAMARA 1",n>=2?"CAMARA 2":null,n>=3?"CAMARA 3":null,"MOVILIDAD"],
    "USA":["DIRECTOR","PRODUCTOR","PERIODISTA 1","PERIODISTA 2"],
    "FUTSAL":["DIRECTOR","ASISTENTE","CAMARA 1",n>=2?"CAMARA 2":null,"MOVILIDAD"],
    "LIGA FEMENINA":["DIRECTOR","ASISTENTE","CAMARA 1",n>=2?"CAMARA 2":null,"MOVILIDAD"],
    "PRIMERA C":["DIRECTOR","CAMARA 1",n>=2?"CAMARA 2":null,"MOVILIDAD"],
    "TENIS":["DIRECTOR","ASISTENTE","CAMARA 1","MOVILIDAD"],
    // backward compat
    "B MET":["DIRECTOR","ASISTENTE","CAMARA 1",n>=2?"CAMARA 2":null,n>=3?"CAMARA 3":null,"MOVILIDAD"],
    "UPSL":["DIRECTOR","PRODUCTOR","PERIODISTA 1","PERIODISTA 2"],
    "UPSL1":["DIRECTOR","PRODUCTOR","PERIODISTA 1","PERIODISTA 2"],
    "FUT FEM":["DIRECTOR","ASISTENTE","CAMARA 1",n>=2?"CAMARA 2":null,"MOVILIDAD"],
  };
  if(fixed[tipo])return fixed[tipo].filter(Boolean);
  // Custom tipo: show all roles (user configures in Tarifas)
  const useCam=tipoUsesCam(tipo);
  return["DIRECTOR","ASISTENTE","PRODUCTOR","CAMARA 1",n>=2&&useCam?"CAMARA 2":null,n>=3&&useCam?"CAMARA 3":null,"PERIODISTA 1","PERIODISTA 2","MOVILIDAD"].filter(Boolean);
}

function getMonto(tipo,rol,camaras){
  const t=ST.tarifas[tipo];if(!t)return 0;
  const v=t[rol];
  if(rol==="DIRECTOR"&&v&&typeof v==="object")return v[String(camaras||1)]||0;
  return v||0;
}
function getIngreso(tipo,camaras){
  const t=ST.tarifasCliente[tipo];
  if(t==null||t===undefined)return 0;
  if(typeof t==="object")return t[String(camaras||"1")]||0;
  return t||0;
}

let ST={tab:'partidos',partidos:[],tarifas:JSON.parse(JSON.stringify(TDEF)),tarifasCliente:JSON.parse(JSON.stringify(TCLIENTE_DEF)),url:localStorage.getItem('gasUrl')||'',loading:false,err:null,form:null,lp:'',lm:'',upslMes:'',filtroTipos:new Set(),collapsedMeses:new Set(),gastos:[]};

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const fmt=n=>n?'$'+Number(n).toLocaleString('es-AR',{maximumFractionDigits:0}):'–';
const fmtI=n=>(n||n===0)&&n!==''?Number(n).toLocaleString('es-AR',{maximumFractionDigits:0}):'';
const parseI=s=>{const n=parseInt(String(s).replace(/[^0-9]/g,''));return isNaN(n)?0:n;};
function toggleFiltro(tipo){
  if(ST.filtroTipos.has(tipo))ST.filtroTipos.delete(tipo);
  else ST.filtroTipos.add(tipo);
  render();
}
function onMoney(el){
  const raw=el.value.replace(/[^0-9]/g,'');
  if(raw===''){el.value='';return;}
  const num=parseInt(raw);
  if(!isNaN(num))el.value=num.toLocaleString('es-AR',{maximumFractionDigits:0});
}
const fmtF=s=>{if(!s)return'';const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[3]+'/'+m[2];const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})};
const mesLbl=ym=>{if(!ym)return'';const[y,m]=ym.split('-');return MESES[+m-1]+' '+y};
const getMes=f=>{if(!f)return'';const m=String(f).match(/^(\d{4}-\d{2})/);return m?m[1]:''};
const main=document.getElementById('main');
const navEl=document.getElementById('nav');
const syncEl=document.getElementById('sync');

function setSt(type,txt){syncEl.textContent=txt;syncEl.style.background=type==='err'?'rgba(220,38,38,.25)':type==='load'?'rgba(251,191,36,.3)':'rgba(255,255,255,.15)'}

async function apiGet(){
  if(!ST.url)return null;
  const r=await fetch(ST.url+'?action=all&_t='+Date.now()+'&token='+encodeURIComponent(window.VETER_TOKEN||''));
  return r.json();
}
async function apiPost(payload){
  if(!ST.url)return;
  await fetch(ST.url,{method:'POST',mode:'no-cors',body:JSON.stringify({...payload,token:window.VETER_TOKEN||''})});
  await new Promise(r=>setTimeout(r,900));
  const d=await apiGet();
  if(d){ST.partidos=(d.partidos||[]).map(p=>{if(!Array.isArray(p.equipo))p.equipo=[];return p;}).sort((a,b)=>+b.num-+a.num);if(d.tarifas){const m=mergeTarifas(d.tarifas);ST.tarifas=m;}}
}

async function loadData(){
  if(!ST.url){render();return}
  setSt('load','↻ cargando...');ST.loading=true;render();
  try{
    const d=await apiGet();
    if(d&&!d.error){
      ST.partidos=(d.partidos||[]).map(p=>{if(!Array.isArray(p.equipo))p.equipo=[];return p;}).sort((a,b)=>+b.num-+a.num);
      if(d.tarifas)ST.tarifas=mergeTarifas(d.tarifas);
      ST.err=null;setSt('ok','⬤ conectado')
    }else{ST.err=d?.error||'Error al cargar';setSt('err','⬤ error')}
  }catch(e){ST.err='No se pudo conectar. Revisá la URL en Config.';setSt('err','⬤ sin conexión')}
  ST.loading=false;render();
}

// Ensure saved tarifas have the new DIRECTOR structure and restore custom tipos
function mergeTarifas(saved){
  if(saved.__tipos){
    TIPOS=[...new Set([...TIPOS_BASE,...saved.__tipos])];
    TIPOS_CAM=[...new Set([...TIPOS_CAM_BASE,...(saved.__tiposCam||[])])];
    TIPOS_COLORS={...saved.__tiposColors||{}};
  }
  if(saved.__cliente){
    ST.tarifasCliente={...JSON.parse(JSON.stringify(TCLIENTE_DEF)),...saved.__cliente};
  }
  if(saved.__gastos)ST.gastos=saved.__gastos;
  const merged=JSON.parse(JSON.stringify(TDEF));
  for(const tipo of TIPOS){
    if(!saved[tipo])continue;
    for(const[k,v]of Object.entries(saved[tipo])){
      if(k==="DIRECTOR"&&TIPOS_CAM.includes(tipo)){
        if(typeof v==="object"){if(!merged[tipo])merged[tipo]={};merged[tipo].DIRECTOR=v}
      }else{if(!merged[tipo])merged[tipo]={};merged[tipo][k]=v}
    }
  }
  return merged;
}

function goTab(t){ST.tab=t;ST.form=null;[...navEl.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',['partidos','liq','balances','upsl','gastos','tarifas','config'][i]===t));render()}

function render(){
  if(ST.tab==='partidos')rPartidos();
  else if(ST.tab==='form')rForm();
  else if(ST.tab==='liq')rLiq();
  else if(ST.tab==='balances')rBalances();
  else if(ST.tab==='upsl')rUpsl();
  else if(ST.tab==='gastos')rGastos();
  else if(ST.tab==='tarifas')rTarifas();
  else rConfig();
}

const ROLE_ABBR={"DIRECTOR":"Dir","ASISTENTE":"Asist","PRODUCTOR":"Prod","CAMARA 1":"Cam1","CAMARA 2":"Cam2","CAMARA 3":"Cam3","PERIODISTA 1":"Per1","PERIODISTA 2":"Per2","MOVILIDAD":"Mov"};
const ROLE_CLASS={"DIRECTOR":"r-dir","ASISTENTE":"r-asist","PRODUCTOR":"r-prod","CAMARA 1":"r-cam","CAMARA 2":"r-cam","CAMARA 3":"r-cam","PERIODISTA 1":"r-per","PERIODISTA 2":"r-per","MOVILIDAD":"r-mov"};
function abbrevName(n){
  const parts=(n||'').trim().split(/\s+/);
  if(parts.length<2)return n||'';
  return parts[0][0]+'. '+parts.slice(1).join(' ');
}

function rPartidos(){
  if(!ST.url){main.innerHTML=`<div class="empty"><svg width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg><h3>Primero configurá la conexión</h3><p>Ir a <strong>Config</strong>, pegá tu URL de Apps Script y guardá.</p><br><button class="btn bp" onclick="goTab('config')">Ir a Config →</button></div>`;return}
  const nxt=ST.partidos.length>0?Math.max(...ST.partidos.map(p=>+p.num||0))+1:4001;
  // Filter chips
  const tiposPresentes=[...new Set(ST.partidos.map(p=>p.tipo))].sort();
  const filtro=ST.filtroTipos;
  const partidosFiltrados=filtro.size===0?ST.partidos:ST.partidos.filter(p=>filtro.has(p.tipo));
  const filterBar=tiposPresentes.length>1?`<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-bottom:12px">
    <span style="font-size:11px;color:var(--t3);font-weight:600;margin-right:2px">Filtrar:</span>
    <button onclick="ST.filtroTipos=new Set();render()" style="border:1px solid ${filtro.size===0?'var(--pri)':'var(--border)'};background:${filtro.size===0?'var(--pri-l)':'var(--surface)'};color:${filtro.size===0?'var(--pri-d)':'var(--t2)'};border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600;cursor:pointer">Todos</button>
    ${tiposPresentes.map(t=>{const on=filtro.has(t);return`<button onclick="toggleFiltro('${t}')" class="badge ${getBadge(t)}" style="padding:4px 12px;font-size:12px;cursor:pointer;border:2px solid ${on?'currentColor':'transparent'};opacity:${on?1:.65};${getBadgeStyle(t)}">${t}</button>`;}).join('')}
  </div>`:'';
  // Sort by fecha+hora descending
  const partidosSorted=[...partidosFiltrados].sort((a,b)=>{
    const fa=(a.fecha||'')+(a.hora||'');const fb=(b.fecha||'')+(b.hora||'');
    return fb.localeCompare(fa);
  });
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px" class="print-hide"><span style="font-size:13px;color:var(--t3)">${partidosFiltrados.length}${filtro.size?'/'+ST.partidos.length:''} partido${ST.partidos.length!==1?'s':''}</span><button class="btn bp" onclick="openNew(${nxt})">+ Nuevo partido</button></div>${filterBar}`;
  if(ST.loading)h+=`<div class="status s-load"><span class="spin">↻</span> Cargando...</div>`;
  if(ST.err)h+=`<div class="status s-err">⚠ ${ST.err}</div>`;
  if(ST.partidos.length===0&&!ST.loading){h+=`<div class="empty"><svg width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 01-1.125-1.125M3.375 19.5h1.5C5.496 19.5 6 18.996 6 18.375m-3.75.125v-1.875m0 0a1.125 1.125 0 011.125-1.125h1.5a1.125 1.125 0 011.125 1.125M3.375 16.5v-1.5M21 16.5v-1.5m0 0a1.125 1.125 0 00-1.125-1.125h-1.5A1.125 1.125 0 0017.25 15m3.75 1.5V15"/></svg><h3>Sin partidos cargados</h3><p>Hacé clic en "+ Nuevo partido" para agregar el primero.</p></div>`;main.innerHTML=h;return}
  const stripeCol={"B METRO":"#22C55E","USA":"#3B82F6","FUTSAL":"#059669","LIGA FEMENINA":"#A855F7","PRIMERA C":"#047857","TENIS":"#EAB308","B MET":"#22C55E","UPSL":"#3B82F6","UPSL1":"#3B82F6","FUT FEM":"#A855F7","OTRO":"#94A3B8"};
  let curMes=null,curDia=null,tableOpen=false;
  const closeTable=()=>{ if(tableOpen){ h+='</div>'; tableOpen=false; } };
  partidosSorted.forEach(p=>{
    const mes=getMes(p.fecha);
    if(mes!==curMes){
      closeTable();
      curMes=mes;curDia=null;
      const collapsed=ST.collapsedMeses.has(mes);
      h+=`<div style="display:flex;align-items:center;gap:10px;margin:${h.length>200?'20px':'0px'} 0 10px">
        <div style="flex:1;height:2px;background:linear-gradient(to right,#006B99,#CBD5E1)"></div>
        <button onclick="toggleMes('${mes}')" style="background:${collapsed?'#006B99':'var(--surface)'};color:${collapsed?'white':'#006B99'};border:2px solid #006B99;border-radius:20px;padding:5px 16px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px">
          ${mesLbl(mes)||'Sin fecha'} <span style="font-size:11px;opacity:.7">${collapsed?'▶':'▼'}</span>
        </button>
        <button onclick="abrirExportMes('${mes}')" style="background:var(--surface);color:#475569;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">📄 Exportar PDF</button>
        <button onclick="expLiquidacion('${mes}')" style="background:var(--surface);color:#15803D;border:1px solid #86EFAC;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">💰 Liquidación</button>
        <div style="flex:1;height:2px;background:linear-gradient(to left,#006B99,#CBD5E1)"></div>
      </div>`;
      if(collapsed)return;
    }
    if(ST.collapsedMeses.has(mes))return;
    if(!Array.isArray(p.equipo))p.equipo=[];
    const tot=p.equipo.reduce((s,e)=>s+(+e.monto||0),0);
    const eq=p.equipo.filter(e=>e.nombre);
    let camCount=p.camaras;
    if(!camCount&&tipoUsesCam(p.tipo)){
      if(eq.some(e=>e.rol==='CAMARA 3'))camCount='3';
      else if(eq.some(e=>e.rol==='CAMARA 2'))camCount='2';
      else if(eq.some(e=>e.rol==='CAMARA 1'))camCount='1';
    }
    const hasCam=tipoUsesCam(p.tipo)&&camCount;
    const ingreso=(+p.ingreso||getIngreso(p.tipo,camCount))+(+p.km_monto||0);
    const margen=ingreso-tot-(+p.imprevisto||0);
    const margenColor=margen>=0?'#059669':'#DC2626';
    const esUpsl=p.tipo==='USA'||p.tipo==='UPSL'||p.tipo==='UPSL1';

    if(!tableOpen){
      h+=`<div class="ptable-wrap"><div style="display:flex;align-items:center;gap:10px;padding:8px 14px 6px;border-bottom:1px solid var(--border);text-transform:uppercase">
        <span style="width:150px;flex-shrink:0"></span>
        <span style="font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--t3);flex:1">Partido</span>
        <span style="font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--t3);width:96px;text-align:right">Costo</span>
        <span style="font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--t3);width:96px;text-align:right">Ingreso</span>
        <span style="font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--t3);width:96px;text-align:right">Marg.</span>
        <span style="width:56px;flex-shrink:0"></span>
      </div>`;
      tableOpen=true;
    }

    const newDay=p.fecha!==curDia; curDia=p.fecha;

    const roleOrder=getRoles(p.tipo,camCount||'1');
    const ordered=[...eq].sort((a,b)=>roleOrder.indexOf(a.rol)-roleOrder.indexOf(b.rol));
    const SLOTS=6;
    const pills=ordered.slice(0,SLOTS).map(e=>{
      const cls=ROLE_CLASS[e.rol]||'r-mov';
      const rol=ROLE_ABBR[e.rol]||e.rol;
      return `<span class="ppill ${cls}"><span class="pdot"></span><span class="prol">${rol}</span><span class="pnom">${abbrevName(e.nombre)}</span><span class="pmon">${fmt(e.monto)}</span></span>`;
    }).join('')+Array(Math.max(0,SLOTS-ordered.length)).fill('<span class="pempty"></span>').join('');

    h+=`<div class="prow${newDay?' newday':''}">
      <div class="pline1">
        <span class="badge ${getBadge(p.tipo)}" style="${getBadgeStyle(p.tipo)}">${p.tipo}</span>
        ${hasCam?`<span class="cam-badge">${camCount} cám</span>`:''}
        <span class="ptime">${fmtF(p.fecha)}${p.hora?' · '+p.hora:''}</span>
        <span class="pmatch">${p.partido}</span>
        <span class="pnum" style="color:#DC2626">${fmt(tot)}</span>
        ${!esUpsl?`<span class="pnum" style="color:#2563EB">${fmt(ingreso)}</span><span class="pnum" style="color:${margenColor}">${margen>=0?'+':''}${fmt(margen)}</span>`:`<span style="font-size:11px;color:#3B82F6;font-weight:600;width:200px;text-align:right">🌐 Liquidado por Veter USA</span>`}
        <button class="bi print-hide" onclick="openEdit('${p.id}')" title="Editar" style="flex-shrink:0">✎</button>
        <button class="bd print-hide" onclick="delP('${p.id}')" title="Eliminar" style="flex-shrink:0">✕</button>
      </div>
      ${ordered.length?`<div class="pline2">${pills}</div>`:''}
    </div>`;
  });
  closeTable();
  main.innerHTML=h;
}

function rForm(){
  const f=ST.form;
  const hasCam=TIPOS_CAM.includes(f.tipo);
  const camaras=f.camaras||'1';
  const roles=f.tipo?getRoles(f.tipo,camaras):[];

function rUpsl(){

  const partidos=lm?ST.partidos.filter(p=>upslTipos.includes(p.tipo)&&getMes(p.fecha)===lm):[];
  const q1=partidos.filter(p=>+p.fecha.slice(8,10)<=15);
  const q2=partidos.filter(p=>+p.fecha.slice(8,10)>15);
  const sumP=arr=>arr.reduce((s,p)=>s+p.equipo.reduce((ss,e)=>ss+(+e.monto||0),0),0);

      <span class="ltot-num mono">${fmt(sumP(partidos))}</span>

  </div>
  <button class="btn bg print-hide" onclick="window.print()" style="margin-top:6px">🖨 Imprimir / exportar PDF</button>`;}
  else body=`<div class="empty" style="padding-top:40px"><svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M12 21a9 9 0 100-18 9 9 0 000 18zm0 0v-9m0 0l-3 3m3-3l3 3"/></svg><h3>Elegí un mes para ver los costos USA</h3></div>`;

function openNew(nxt){
  ST.form={id:null,num:String(nxt),fecha:new Date().toISOString().slice(0,10),hora:'',tipo:'',camaras:'2',partido:'',equipo:[],ingreso:'',km_estadio:'',km_monto:0,imprevisto:0};
  ST.tab='form';[...navEl.querySelectorAll('button')].forEach(b=>b.classList.remove('on'));render()
}
function openEdit(id){
  const p=ST.partidos.find(x=>x.id===id);if(!p)return;
  ST.form=JSON.parse(JSON.stringify(p));
  // Fix ingreso that was saved without trailing zeros
  const expectedIng = getIngreso(ST.form.tipo, ST.form.camaras);
  if(ST.form.ingreso && +ST.form.ingreso > 0 && expectedIng > 0 && +ST.form.ingreso < 10000 && expectedIng >= 10000){
    ST.form.ingreso = +ST.form.ingreso * 1000;
  }
  ST.form.camaras=ST.form.camaras||'2';
  if(!ST.form.ingreso&&ST.form.ingreso!==0)ST.form.ingreso='';
  const roles=getRoles(p.tipo,ST.form.camaras);
  ST.form.equipo=roles.map(r=>ST.form.equipo.find(e=>e.rol===r)||{rol:r,nombre:'',monto:''});
  ST.tab='form';[...navEl.querySelectorAll('button')].forEach(b=>b.classList.remove('on'));render()
}

function chgTipo(tipo){
  // Preserve what the user already typed before re-rendering
  ST.form.num=document.getElementById('fn')?.value||ST.form.num;
  ST.form.fecha=document.getElementById('ff')?.value||ST.form.fecha;
  ST.form.hora=document.getElementById('fh')?.value||ST.form.hora;
  ST.form.partido=document.getElementById('fp')?.value||ST.form.partido;
  ST.form.tipo=tipo;
  const cam=TIPOS_CAM.includes(tipo)?ST.form.camaras||'2':'1';
  ST.form.camaras=cam;
  ST.form.ingreso=getIngreso(tipo,cam)||ST.form.ingreso||'';
  const roles=getRoles(tipo,cam);
  ST.form.equipo=roles.map(r=>({rol:r,nombre:'',monto:getMonto(tipo,r,cam)}));
  ST.form.ingreso=getIngreso(tipo,cam)||'';
  render();
}

function chgCam(cam){
  ST.form.camaras=cam;
  ST.form.ingreso=getIngreso(ST.form.tipo,cam)||ST.form.ingreso||'';
  const tipo=ST.form.tipo;
  const roles=getRoles(tipo,cam);
  const prev=ST.form.equipo;
  ST.form.equipo=roles.map(r=>{
    const existing=prev.find(e=>e.rol===r);
    if(r==='DIRECTOR'){return{rol:r,nombre:existing?.nombre||'',monto:getMonto(tipo,r,cam)}}
    return existing||{rol:r,nombre:'',monto:getMonto(tipo,r,cam)};
  });

function acHide(i){const list=document.getElementById('ac-'+i);if(list)list.style.display='none'}
function acPick(i,name){
  ST.form.equipo[i].nombre=name;
  if(!ST.form.equipo[i].monto)ST.form.equipo[i].monto=getMonto(ST.form.tipo,ST.form.equipo[i].rol,ST.form.camaras);
  const input=document.getElementById('eq-n-'+i);

  if(monto)monto.focus();

function acKey(e,i){
  const list=document.getElementById('ac-'+i);
  if(!list||list.style.display==='none')return;
  const items=[...list.querySelectorAll('.ac-item')];
  const cur=items.findIndex(el=>el.classList.contains('sel'));
  if(e.key==='ArrowDown'){e.preventDefault();const nx=Math.min(cur+1,items.length-1);items.forEach((el,j)=>el.classList.toggle('sel',j===nx))}
  else if(e.key==='ArrowUp'){e.preventDefault();const pv=Math.max(cur-1,0);items.forEach((el,j)=>el.classList.toggle('sel',j===pv))}
  else if(e.key==='Enter'&&cur>=0){e.preventDefault();acPick(i,items[cur].textContent.trim())}
  else if(e.key==='Escape')acHide(i);
}

          <option value="inversion">Inversión</option>
        </select></div>
        <div><label>Descripción</label><input id="g-desc" placeholder="Ej: Alquiler oficina" oninput="this.value=this.value.toUpperCase()"></div>
        <div><label>Categoría</label>
          <div style="display:flex;gap:4px">
            <select id="g-cat" style="flex:1">${allCats.map(c=>`<option>${c}</option>`).join('')}</select>
            <button onclick="addCatDialog()" title="Nueva categoría" style="background:#F1F5F9;border:1px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:13px">+</button>
          </div>
        </div>
        <div><label>Monto</label><input id="g-monto" type="text" inputmode="numeric" placeholder="0" oninput="onMoney(this)"></div>
        <button class="btn bp" onclick="addGasto()" style="white-space:nowrap;align-self:flex-end">+ Agregar</button>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
        <div id="g-fecha-wrap"><label>Fecha</label><input id="g-fecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div id="g-mesdesde-wrap" style="display:none"><label>Desde mes</label><input id="g-mesdesde" type="month" value="${new Date().toISOString().slice(0,7)}"></div>
        <div id="g-meshasta-wrap" style="display:none"><label>Hasta mes <span style="font-weight:400;color:var(--t3)">(vacío = vigente)</span></label><input id="g-meshasta" type="month" placeholder=""></div>
      </div>
    </div>
  </div>`;
  if(gastos.length===0){main.innerHTML=formHtml+`<div class="empty"><h3>Sin gastos cargados</h3></div>`;return;}
  const unicos=gastos.filter(g=>g.tipo==='unico').sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const recurrentes=gastos.filter(g=>g.tipo==='recurrente');
  const inversiones=gastos.filter(g=>g.tipo==='inversion');
  const gRow=g=>`<div style="display:grid;grid-template-columns:100px 1fr 130px 120px auto;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border)">
    <span style="font-size:12px;color:var(--t3)">${g.tipo==='unico'?fmtF(g.fecha):g.tipo==='inversion'?fmtF(g.fecha)||'Inversión':g.mesHasta?mesLbl(g.mesDesde)+' → '+mesLbl(g.mesHasta):'Desde '+mesLbl(g.mesDesde)}</span>
    <span style="font-weight:600;font-size:13px">${g.descripcion}${g.tipo==='recurrente'?`<span style="font-size:10px;color:var(--t3);font-weight:400;margin-left:6px">desde ${mesLbl(g.mesDesde)}</span>`:''}</span>
    <span><span style="background:${GCAT_COLOR[g.categoria]||'#F1F5F9'};color:${GCAT_TEXT[g.categoria]||'#475569'};border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700">${g.categoria}</span></span>
    <span style="font-weight:700;color:#DC2626;font-feature-settings:'tnum';text-align:right">${fmt(g.monto)}</span>
    <button class="bd" onclick="delGasto('${g.id}')">✕</button>
  </div>`;
  let body='';
  if(inversiones.length){
    const totInv=inversiones.reduce((s,g)=>s+(+g.monto||0),0);
    body+=`<div class="card" style="margin-bottom:14px;border-color:#7C3AED"><div class="ch" style="background:#F5F3FF;justify-content:space-between"><strong style="color:#5B21B6">💼 Inversiones</strong><span style="color:#5B21B6;font-weight:700">${fmt(totInv)}</span></div>${inversiones.map(gRow).join('')}</div>`;
  }
  if(unicos.length)body+=`<div class="card" style="margin-bottom:14px"><div class="ch" style="justify-content:space-between"><strong>Gastos únicos</strong><span style="color:#DC2626;font-weight:700">${fmt(unicos.reduce((s,g)=>s+(+g.monto||0),0))}</span></div>${unicos.map(gRow).join('')}</div>`;
  if(recurrentes.length)body+=`<div class="card" style="margin-bottom:14px"><div class="ch" style="justify-content:space-between"><strong>Gastos mensuales</strong><span style="color:#DC2626;font-weight:700">${fmt(recurrentes.reduce((s,g)=>s+(+g.monto||0),0))}/mes</span></div>${recurrentes.map(gRow).join('')}</div>`;
  main.innerHTML=formHtml+body;
}

function onGastoTipo(v){
  document.getElementById('g-fecha-wrap').style.display=(v==='unico'||v==='inversion')?'block':'none';
  document.getElementById('g-mesdesde-wrap').style.display=v==='recurrente'?'block':'none';
  document.getElementById('g-meshasta-wrap').style.display=v==='recurrente'?'block':'none';
}
function addCatDialog(){
  const nueva=(prompt('Nueva categoría:')||'').trim().toUpperCase();
  if(!nueva)return;
  const sel=document.getElementById('g-cat');
  if(!sel)return;
  const opt=document.createElement('option');
  opt.value=nueva;opt.textContent=nueva;opt.selected=true;
  sel.appendChild(opt);
}
function addGasto(){
  const tipo=document.getElementById('g-tipo')?.value||'unico';
  const desc=(document.getElementById('g-desc')?.value||'').trim().toUpperCase();
  const cat=document.getElementById('g-cat')?.value||'Otro';
  const monto=parseI(document.getElementById('g-monto')?.value||'0');
  const fecha=document.getElementById('g-fecha')?.value||'';
  const mesDesde=document.getElementById('g-mesdesde')?.value||'';
  const mesHasta=document.getElementById('g-meshasta')?.value||'';
  if(!desc){alert('Ingresá una descripción.');return;}
  ST.gastos.push({id:'g_'+Date.now(),tipo,descripcion:desc,categoria:cat,monto,fecha,mesDesde,mesHasta});
  saveTar();
}
function delGasto(id){if(!confirm('¿Eliminar?'))return;ST.gastos=ST.gastos.filter(g=>g.id!==id);saveTar();}

loadData();
</script>
</body>
</html>
