<head>

<title>🇺🇸 ADMIN-VTR-USA</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F0F4F8;--surface:#fff;--border:#E2E8F0;--text:#1A202C;--t2:#4A5568;--t3:#94A3B8;--pri:#1D4ED8;--pri-d:#1e40af;--pri-l:#EFF6FF;--radius:8px;--rlg:12px;--shadow:0 1px 3px rgba(0,0,0,.07)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
header{background:#1D4ED8;color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:12px;height:52px;position:sticky;top:0;z-index:10}
nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:center;padding:10px 16px;gap:6px;overflow-x:auto;position:sticky;top:52px;z-index:9}
nav button{background:none;border:1px solid transparent;border-radius:20px;color:var(--t2);cursor:pointer;font:13px/1 inherit;font-weight:500;padding:7px 18px;white-space:nowrap;transition:all .15s}
nav button.on{background:#1D4ED8;border-color:#1D4ED8;color:#fff;font-weight:600}
nav button:hover:not(.on){background:var(--bg);border-color:var(--border);color:var(--text)}
main{max-width:1280px;margin:0 auto;padding:20px 24px}
label{display:block;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font:14px inherit;color:var(--text);background:var(--surface);transition:border .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
.btn{border:none;border-radius:var(--radius);cursor:pointer;font:13px/1 inherit;font-weight:600;padding:8px 16px;transition:all .15s}
.bp{background:#1D4ED8;color:#fff}.bp:hover{background:#1e40af}
.bd{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;cursor:pointer;border-radius:var(--radius);padding:5px 9px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.ch{background:#F7F8FA;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cb{padding:14px 16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.b-usa{background:#DBEAFE;color:#1D4ED8}
.empty{text-align:center;padding:60px 20px;color:var(--t3)}
.empty h3{font-size:16px;color:var(--t2);margin-bottom:8px}
.status{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:12px}
.s-load{background:#EFF6FF;color:#1D4ED8}
/* Partido cards */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow);display:grid;grid-template-columns:5px 1fr}
.pcard-stripe{width:5px;background:#1D4ED8}
.pcard-body{padding:12px 16px}
.pcard-top{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin-bottom:0}
.pcard-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.pcard-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px}
.pcard-num{font-size:11px;color:var(--t3);font-weight:600}
.pcard-fecha{font-size:13px;font-weight:700;background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;border-radius:20px;padding:3px 12px;white-space:nowrap}
.pcard-nombre{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-fin-item{display:flex;flex-direction:column;background:#F7F8FA;border:1px solid var(--border);border-radius:8px;padding:5px 12px;min-width:100px;text-align:right}
.pcard-fin-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:1px}
.pcard-fin-val{font-size:14px;font-weight:700}
.pcard-eq{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.pcard-chip{background:#F7F8FA;border:1px solid var(--border);border-radius:6px;padding:5px 10px;display:flex;align-items:center;gap:8px}
.pcard-chip-rol{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);white-space:nowrap}
.pcard-chip-nom{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap}
.pcard-chip-mon{font-size:12px;color:#059669;font-weight:700;white-space:nowrap;margin-left:auto}
.pcard-chip-sep{width:1px;background:var(--border);height:14px;flex-shrink:0}
.tc-pill{background:#DCFCE7;color:#15803D;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.lrow{display:grid;grid-template-columns:60px 1fr auto auto;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);font-size:13px}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:#F8FAFC}
@media print{header,nav,.btn,.bd,.print-hide{display:none!important}main{padding:0}.card{box-shadow:none}}
</style>
</head>

<script>
(function(){
  var PASS='Maradona.10';
  var ok=sessionStorage.getItem('veterAuth')===PASS;
  while(!ok){
    var input=prompt('Veter — Passphrase de acceso:');
    if(input===null){location.href='about:blank';throw new Error('cancelado');}
    if(input===PASS){sessionStorage.setItem('veterAuth',PASS);ok=true;}
    else alert('Passphrase incorrecta.');
  }
  window.VETER_TOKEN=PASS;
})();
</script>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DEFAULT_INGRESO_USD = 350;
const DEFAULT_TC = 1385;

// ── STATE ─────────────────────────────────────────────────────────────────
let ST = {
  tab: 'partidos',
  partidos: [],        // filtered USA partidos from ARG sheet
  usaEquipo: {},       // {partidoId: [{nombre, rol, monto_usd}]}
  clubes: {},          // {clubName: {ingreso_usd: 350}}
  tcHistory: {},       // {fecha: tc} - stored TC per date
  tcHoy: null,         // today's TC fetched from API
  urlArg: localStorage.getItem('gasUrlArg') || '',
  urlUsa: localStorage.getItem('gasUrlUsa') || '',
  url: localStorage.getItem('gasUrlArg') || '', // kept for compat
  loading: false,
  err: null,
  editId: null,        // partido being edited for USA equipo
  collapsedMeses: new Set(),
  personasUsa: {}  // {nombre: {rol, monto_usd}}
};

// ── HELPERS ───────────────────────────────────────────────────────────────
const fmtUSD = n => n !== '' && n !== null && n !== undefined ? '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2}) : '–';
const fmtARS = n => n ? '$' + Number(n).toLocaleString('es-AR', {maximumFractionDigits:0}) : '–';
const fmtF = s => { if(!s)return''; const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[3]+'/'+m[2]; return s; };
const getMes = f => { if(!f)return''; const m=String(f).match(/^(\d{4}-\d{2})/); return m?m[1]:''; };
const mesLbl = ym => { if(!ym)return''; const[y,mo]=ym.split('-'); return MESES[+mo-1]+' '+y; };
const parseI = s => { const n=parseInt(String(s).replace(/[^0-9]/g,'')); return isNaN(n)?0:n; };

function setSt(type, msg){
  const el=document.getElementById('sync'); if(!el)return;
  el.textContent=msg;
  el.style.background=type==='ok'?'rgba(209,250,229,.3)':type==='err'?'rgba(254,226,226,.3)':'rgba(255,255,255,.15)';
}

// ── TC (TIPO DE CAMBIO) ────────────────────────────────────────────────────
async function fetchTC(){
  try{
    const r = await fetch('https://dolarapi.com/v1/dolares/oficial');
    const d = await r.json();
    return Math.round((d.compra + d.venta) / 2);
  } catch(e){
    try{
      const r2 = await fetch('https://api.bluelytics.com.ar/v2/latest');
      const d2 = await r2.json();
      return Math.round((d2.oficial.value_buy + d2.oficial.value_sell) / 2);
    } catch(e2){
      return DEFAULT_TC;
    }
  }
}

function getTCForDate(fecha){
  return ST.tcHistory[fecha] || ST.tcHoy || DEFAULT_TC;
}

function pesoToUSD(pesos, fecha){
  const tc = getTCForDate(fecha);
  if(!tc || !pesos) return 0;
  return Math.round((pesos / tc) * 100) / 100;
}

async function savePersonasUsa(){

}

// ── LOAD ───────────────────────────────────────────────────────────────────
async function apiPostUsa(data){
  if(!ST.urlUsa) return {ok:true, partidos:[], tarifas:{}};
  try{
    const r = await fetch(ST.urlUsa, {method:'POST', body: JSON.stringify({...data, token:window.VETER_TOKEN||''})});
    const text = await r.text();
    const j = JSON.parse(text);
    if(j.error && j.error !== 'acción desconocida') throw new Error(j.error);
    return j;
  } catch(e){
    console.log('USA API:', e.message);
    return {ok:true, partidos:[], tarifas:{}};
  }
}

async function loadData(){
  if(!ST.urlArg){ render(); return; }
  ST.loading = true; setSt('load','↻ cargando...'); render();
  try{
    ST.tcHoy = await fetchTC();

    // Load ARG partidos
    const d = await fetch(ST.urlArg + '?action=all&_t=' + Date.now() + '&token=' + encodeURIComponent(window.VETER_TOKEN||'')).then(r=>r.json());
    ST.partidos = (d.partidos || [])
      .filter(p => p.tipo === 'USA' || p.tipo === 'UPSL' || p.tipo === 'UPSL1')
      .reverse();

    // Load ARG-side USA config (clubes, tcHistory)
    const tar = d.tarifas || {};
    ST.clubes = tar.__usaClubes || {};  // keyed by partido id
    ST.tcHistory = tar.__usaTcHistory || {};
    const today = new Date().toISOString().slice(0,10);
    if(!ST.tcHistory[today]) ST.tcHistory[today] = ST.tcHoy;

    // Load USA sheet data (usaEquipo) via POST
    if(ST.urlUsa){
      try{
        const du = await apiPostUsa({action:'getAll'});
        const tar2 = du.tarifas || {};
        ST.usaEquipo = tar2.__usaEquipo || {};
        ST.personasUsa = tar2.__personasUsa || {};
      } catch(e){ console.log('USA sheet not loaded:', e); ST.usaEquipo={}; ST.personasUsa={}; }
    }

    setSt('ok', '⬤ conectado');
  } catch(e){ ST.err = 'Error: ' + e.message; setSt('err','⬤ error'); }
  ST.loading = false; render();
}

// ── PARTIDOS ───────────────────────────────────────────────────────────────
const CLUBES_FIJOS = ['LAKELAND','STETSON','DEPORTIVO ROSE CITY','CHARLOTTETOWNE','UPSL'];

function getClubFromPartido(partido){
  const n = (partido||'').toUpperCase();
  for(const k of CLUBES_FIJOS){
    if(n.includes(k.toUpperCase())) return k;
  }
  return null;
}

function getIngresoPartido(pid){
  return ST.clubes[pid]?.ingreso_usd ?? DEFAULT_INGRESO_USD;
}

function getClientePartido(pid){
  return ST.clubes[pid]?.cliente || getClubFromPartido((ST.partidos.find(p=>p.id===pid)||{}).partido||'') || '';
}

function rPartidos(){
  if(!ST.urlArg){ mainEl.innerHTML=noUrl(); return; }

  const lista = [...ST.partidos].sort((a,b)=>{
    const fa=(a.fecha||'')+(a.hora||''); const fb=(b.fecha||'')+(b.hora||'');

  if(ST.err) h+=`<div style="padding:10px;background:#FEF2F2;border-radius:8px;color:#DC2626;margin-bottom:12px">⚠ ${ST.err}</div>`;

  let curMes = null;

    const mes = getMes(p.fecha);
    if(mes !== curMes){

      h += '<div style="flex:1;height:2px;background:linear-gradient(to right,#1D4ED8,#CBD5E1)"></div>';
      h += '<button data-mes="'+mes+'" onclick="toggleMes(this.dataset.mes)" style="background:'+(collapsed?'#1D4ED8':'var(--surface)')+';color:'+(collapsed?'white':'#1D4ED8')+';border:2px solid #1D4ED8;border-radius:20px;padding:5px 16px;font-size:13px;font-weight:700;cursor:pointer">'+(mesLbl(mes)||'Sin fecha')+' <span style="font-size:11px;opacity:.7">'+(collapsed?'▶':'▼')+'</span></button>';
      h += '<div style="flex:1;height:2px;background:linear-gradient(to left,#1D4ED8,#CBD5E1)"></div></div>';
      if(collapsed) return;
    }
    if(ST.collapsedMeses.has(mes)) return;

    const eq = p.equipo || [];
    const costoARS = eq.reduce((s,e)=>s+(+e.monto||0), 0);
    const tc = getTCForDate(p.fecha);
    const costoARStoUSD = pesoToUSD(costoARS, p.fecha);
    const usaEq = ST.usaEquipo[p.id] || [];
    const usaCostoUSD = usaEq.reduce((s,e)=>s+(+e.monto_usd||0), 0);
    const costoTotalUSD = costoARStoUSD + usaCostoUSD;
    const ingUSD = getIngresoPartido(p.id);
    const margenUSD = ingUSD - costoTotalUSD;
    const mc = margenUSD >= 0 ? '#059669' : '#DC2626';
    const club = getClubFromPartido(p.partido);

    h += '<div class="pcard"><div class="pcard-stripe"></div><div class="pcard-body">';
    h += '<div class="pcard-top">';
    h += '<div class="pcard-left">';
    h += '<span class="pcard-num">#'+p.num+'</span>';
    h += '<span class="pcard-fecha">'+fmtF(p.fecha)+(p.hora?' · '+p.hora:'')+'</span>';
    h += '<span class="pcard-nombre">'+p.partido+'</span>';
    h += '</div>';
    const clienteActual = getClientePartido(p.id);
    const optsClub = [''].concat(CLUBES_FIJOS).map(c=>'<option value="'+c+'"'+(clienteActual===c?' selected':'')+'>'+( c||'— sin asignar —')+'</option>').join('');
    const ingActual = ST.clubes[p.id]?.ingreso_usd ?? DEFAULT_INGRESO_USD;
    h += '<div class="pcard-right">';
    h += '<span style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap">Cliente:</span>';
    h += '<select data-pid="'+p.id+'" onchange="setCliente(this)" style="font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;color:var(--t2);height:36px">';
    h += optsClub+'</select>';
    h += '<div class="pcard-fin-item">';
    h += '<span class="pcard-fin-lbl">Ingreso USD</span>';
    h += '<input type="number" id="ing-'+p.id+'" value="'+ingActual+'" style="width:70px;border:none;background:transparent;font-size:14px;font-weight:700;color:#2563EB;text-align:right;padding:0">';
    h += '</div>';
    h += '<button id="ok-'+p.id+'" data-pid="'+p.id+'" onclick="confirmarIngreso(this)" style="background:#2563EB;color:white;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap">✓ OK</button>';
    h += '<div class="pcard-fin-item"><span class="pcard-fin-lbl">Costo USD</span><span class="pcard-fin-val" style="color:#DC2626">'+fmtUSD(costoTotalUSD)+'</span></div>';
    h += '<div class="pcard-fin-item"><span class="pcard-fin-lbl">Margen USD</span><span class="pcard-fin-val" style="color:'+mc+'">'+(margenUSD>=0?'+':'')+fmtUSD(margenUSD)+'</span></div>';
    h += '</div></div>';

    // ARG equipo chips
    const argChips = eq.filter(e=>e.nombre).map(e=>{
      const montoUSD = pesoToUSD(+e.monto||0, p.fecha);

    }).join('');

      return '<div class="pcard-chip" style="background:#EFF6FF;border-color:#BFDBFE"><span class="pcard-chip-rol" style="color:#1D4ED8">'+e.rol+'</span><div class="pcard-chip-sep"></div><span class="pcard-chip-nom">'+e.nombre+'</span><span class="pcard-chip-mon" style="color:#1D4ED8">'+fmtUSD(e.monto_usd)+'</span><span style="font-size:9px;background:#DBEAFE;color:#1D4ED8;border-radius:4px;padding:1px 5px;font-weight:700">USA</span></div>';
    }).join('');

    h += '<div class="pcard-eq">'+argChips+usaChips+'<button data-pid="'+p.id+'" onclick="openEditUSA(this.dataset.pid)" style="background:#EFF6FF;color:#1D4ED8;border:1px dashed #93C5FD;border-radius:6px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer">+ Equipo USA</button></div>';
    h += '</div></div>';
  });
  mainEl.innerHTML = h;
}

function setUSAField(el){
  const pid=el.dataset.pid; const idx=+el.dataset.idx; const field=el.dataset.field;

}
function setUSAPersona(sel){
  const pid=sel.dataset.pid; const idx=+sel.dataset.idx;
  const nombre=sel.value;
  if(!ST.usaEquipo[pid]) return;
  ST.usaEquipo[pid][idx].nombre=nombre;
  const p=ST.personasUsa[nombre];
  if(p){ 
    if(p.rol) ST.usaEquipo[pid][idx].rol=p.rol;
    if(p.monto_usd) ST.usaEquipo[pid][idx].monto_usd=p.monto_usd;
  }
  rEditUSA();
}
function removeUSAEqBtn(btn){
  removeUSAEq(btn.dataset.pid, +btn.dataset.idx);
}
function addUSAEq(pid){
  if(!ST.usaEquipo[pid]) ST.usaEquipo[pid]=[];
  ST.usaEquipo[pid].push({rol:'CAMARA',nombre:'',monto_usd:0});
  rEditUSA();
}

function removeUSAEq(pid,i){
  ST.usaEquipo[pid].splice(i,1);

}

function rBalances(){

  ST.partidos.forEach(p=>{ const m=getMes(p.fecha); if(!m)return; if(!byMes[m])byMes[m]=[]; byMes[m].push(p); });
  const meses = Object.keys(byMes).sort().reverse();

  let totIng=0, totCosto=0, totP=0;

  meses.forEach(mes=>{

    <div class="ch" style="background:var(--pri-l);justify-content:space-between">
      <strong>Total acumulado — ${meses.length} mes${meses.length!==1?'es':''}</strong>
      <span style="font-size:12px;color:var(--t3)">${totP} partidos</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr)">
      <div style="padding:16px 18px;border-right:1px solid var(--border)"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;margin-bottom:6px">Ingreso total</div><div style="font-size:24px;font-weight:700;color:#059669">${fmtUSD(totIng)}</div></div>
      <div style="padding:16px 18px;border-right:1px solid var(--border)"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;margin-bottom:6px">Costo total</div><div style="font-size:24px;font-weight:700;color:#DC2626">${fmtUSD(totCosto)}</div></div>
      <div style="padding:16px 18px"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;margin-bottom:6px">Margen total <span style="font-size:10px;font-weight:400">(${totPct}%)</span></div><div style="font-size:24px;font-weight:700;color:${totMar>=0?'#059669':'#DC2626'}">${totMar>=0?'+':''}${fmtUSD(totMar)}</div></div>
    </div>
  </div>`;

  </div>
  <div style="text-align:right">
    <button class="btn bp" onclick="guardarClubes()">💾 Guardar clubes</button>
  </div>`;
}

function addClub(){
  const nombre = (document.getElementById('club-nombre')?.value||'').trim().toUpperCase();
  const ingreso = +(document.getElementById('club-ingreso')?.value||350);
  if(!nombre){ alert('Ingresá el nombre del club.'); return; }
  ST.clubes[nombre] = {ingreso_usd: ingreso};
  render();
}
function delClub(nombre){ if(!confirm(`¿Eliminar ${nombre}?`))return; delete ST.clubes[nombre]; render(); }

async function guardarClubes(){
  setSt('load','↻ guardando...');
  try{
    await saveUsaConfig();
    setSt('ok','⬤ guardado'); alert('Clubes guardados.');
  } catch(e){ setSt('err','⬤ error'); alert('Error: '+e.message); }
}

// ── CONFIG ─────────────────────────────────────────────────────────────────
function rConfig(){
  const personas = Object.entries(ST.personasUsa).sort(([a],[b])=>a.localeCompare(b));
  const persRows = personas.map(([nombre,p])=>'<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px 10px;font-weight:600">'+nombre+'</td><td style="padding:8px 10px;color:var(--t3)">'+p.rol+'</td><td style="padding:8px 10px;text-align:right;color:#059669;font-weight:600">$'+p.monto_usd+'</td><td style="padding:8px 10px;text-align:right"><button class="bd" data-nombre="'+nombre+'" onclick="delPersonaUsa(this)">✕</button></td></tr>').join('');
  mainEl.innerHTML='<div class="card" style="margin-bottom:12px">'
    +'<div class="ch"><strong>URL Apps Script — Argentina</strong></div>'
    +'<div class="cb"><div style="display:flex;gap:8px"><input id="url-arg-inp" type="text" value="'+ST.urlArg+'" placeholder="https://script.google.com/macros/s/...ARG..."><button class="btn bp" onclick="saveUrlArg()">Guardar</button></div></div>'
    +'</div>'
    +'<div class="card" style="margin-bottom:12px">'
    +'<div class="ch"><strong>URL Apps Script — USA</strong></div>'
    +'<div class="cb"><div style="display:flex;gap:8px"><input id="url-usa-inp" type="text" value="'+ST.urlUsa+'" placeholder="https://script.google.com/macros/s/...USA..."><button class="btn bp" onclick="saveUrlUsa()">Guardar</button></div></div>'
    +'</div>'
    +'<div class="card">'
    +'<div class="ch"><strong>Directorio equipo USA</strong></div>'
    +'<div class="cb">'
    +(personas.length?'<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px"><thead><tr style="background:#F7F8FA"><th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--border)">Nombre</th><th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--border)">Rol</th><th style="padding:8px 10px;text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--border)">Monto USD</th><th style="padding:8px 10px;border-bottom:1px solid var(--border)"></th></tr></thead><tbody>'+persRows+'</tbody></table>':'')
    +'<label style="margin-bottom:10px">Agregar persona</label>'
    +'<div style="display:grid;grid-template-columns:1fr 140px 120px auto;gap:8px;align-items:end">'
    +'<div><label>Nombre</label><input id="pusa-nombre" placeholder="MARK JOHNSON" oninput="this.value=this.value.toUpperCase()"></div>'
    +'<div><label>Rol</label><select id="pusa-rol"><option>PRODUCTOR</option><option selected>CAMARA</option><option>RELATOR</option></select></div>'
    +'<div><label>Monto USD</label><input id="pusa-monto" type="number" placeholder="150"></div>'
    +'<button class="btn bp" onclick="addPersonaUsa()">+ Agregar</button>'
    +'</div>'
    +'<div style="margin-top:14px;text-align:right"><button class="btn bp" onclick="guardarPersonasUsa()">💾 Guardar directorio</button></div>'
    +'</div></div>';
}

function addPersonaUsa(){
  const nombre=(document.getElementById('pusa-nombre')?.value||'').trim().toUpperCase();
  const rol=document.getElementById('pusa-rol')?.value||'CAMARA';
  const monto=+(document.getElementById('pusa-monto')?.value||0);
  if(!nombre){alert('Ingresá el nombre.');return;}
  ST.personasUsa[nombre]={rol,monto_usd:monto};
  render();
}
function delPersonaUsa(btn){
  const nombre=btn.dataset.nombre;
  if(!confirm('¿Eliminar a '+nombre+'?'))return;
  delete ST.personasUsa[nombre];
  render();
}
async function guardarPersonasUsa(){
  setSt('load','↻ guardando...');
  await savePersonasUsa();
  setSt('ok','⬤ guardado');
  alert('Directorio guardado.');
}
function saveUrlArg(){
  const v = document.getElementById('url-arg-inp')?.value.trim();
  if(!v){ alert('Pegá la URL.'); return; }
  ST.urlArg=v; ST.url=v; localStorage.setItem('gasUrlArg',v);
  alert('URL de ARG guardada. Cargando...'); loadData();
}
function saveUrlUsa(){
  const v = document.getElementById('url-usa-inp')?.value.trim();
  if(!v){ alert('Pegá la URL.'); return; }
  ST.urlUsa=v; localStorage.setItem('gasUrlUsa',v);
  alert('URL de USA guardada.');
}

async function refetchTC(){
  setSt('load','↻ obteniendo TC...');
  ST.tcHoy = await fetchTC();
  const today = new Date().toISOString().slice(0,10);
  ST.tcHistory[today] = ST.tcHoy;
  setSt('ok',`⬤ TC: $${ST.tcHoy.toLocaleString('es-AR')}`);
  render();
}

function noUrl(){
  return `<div class="empty"><h3>Primero configurá la conexión</h3><p>Ir a <strong>Config</strong> y pegá la URL del Apps Script de Argentina.</p><br><button class="btn bp" onclick="goTab('config')">Ir a Config →</button></div>`;
}
