<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Veter</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0B1220;overflow:hidden}
  .topbar{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:center;z-index:5;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);pointer-events:none}
  .topbar img{height:26px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
  .flags{display:flex;height:100vh;width:100vw}
  .col{position:relative;flex:1;overflow:hidden;text-decoration:none;display:flex;align-items:flex-end;justify-content:center;filter:grayscale(1) brightness(.55);transition:filter .45s ease,flex .45s ease;cursor:pointer}
  .flags:hover .col{flex:0.85}
  .col:hover{filter:grayscale(0) brightness(1);flex:1.6!important}
  .flagbg{position:absolute;inset:0}
  .col .label{position:relative;z-index:2;color:#fff;text-align:center;padding-bottom:42px;text-shadow:0 2px 14px rgba(0,0,0,.65);transition:transform .35s ease,opacity .35s ease}
  .col .code{display:block;font-size:15px;font-weight:800;letter-spacing:3px;opacity:.85;margin-bottom:4px}
  .col .name{display:block;font-size:15px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transform:translateY(6px);opacity:.75}
  .col:hover .name{transform:translateY(0);opacity:1}
  .col:hover .code{font-size:17px}
  .col::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 45%);z-index:1}
  footer{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:11px;z-index:5;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  @media(max-width:700px){
    .flags{flex-direction:column}
    .col:hover{flex:1.6!important}
  }
</style>
</head>
<body>
<script>
(function(){
  var PASS='Maradona.10';
  var ok=sessionStorage.getItem('veterAuth')===PASS;
  while(!ok){
    var input=prompt('Veter — Passphrase de acceso:');
    if(input===null){location.href='about:blank';throw new Error('cancelado');}
    if(input===PASS){sessionStorage.setItem('veterAuth',PASS);ok=true;}
    else alert('Passphrase incorrecta.');
  }
})();
</script>

<script>
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

// ── Argentina: Sol de Mayo (32 rayos alternados) ──
(function(){
  const g=document.getElementById('sun-arg');
  const R1=13,R2=22; // rayo recto corto / rayo ondulado largo
  for(let i=0;i<32;i++){
    const a=(i/32)*2*Math.PI;
    const len = i%2===0 ? R2 : R1*1.5;
    const w = i%2===0 ? 2.6 : 2.2;
    const x2=Math.cos(a)*len, y2=Math.sin(a)*len;
    const x1=Math.cos(a)*10, y1=Math.sin(a)*10;
    const perp=a+Math.PI/2;
    const wx=Math.cos(perp)*w, wy=Math.sin(perp)*w;
    const pts=`${x1+wx},${y1+wy} ${x2},${y2} ${x1-wx},${y1-wy}`;
    g.appendChild(el('polygon',{points:pts,fill:'#F6B40E',stroke:'#8a5a00','stroke-width':0.4}));
  }
  g.appendChild(el('circle',{r:10,fill:'#F6B40E',stroke:'#8a5a00','stroke-width':0.6}));
  g.appendChild(el('circle',{cx:-3.2,cy:-2,r:1.1,fill:'#8a5a00'}));
  g.appendChild(el('circle',{cx:3.2,cy:-2,r:1.1,fill:'#8a5a00'}));
  const mouth=el('path',{d:'M -3.5 2.5 Q 0 5.5 3.5 2.5',fill:'none',stroke:'#8a5a00','stroke-width':0.8,'stroke-linecap':'round'});
  g.appendChild(mouth);
})();

// ── Venezuela: arco de 8 estrellas ──
(function(){
  const g=document.getElementById('stars-ve');
  function star(cx,cy,r){
    let d='';
    for(let i=0;i<10;i++){
      const a=(i/10)*2*Math.PI - Math.PI/2;
      const rad = i%2===0 ? r : r*0.42;
      const x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad;
      d+=(i===0?'M':'L')+x.toFixed(2)+','+y.toFixed(2)+' ';
    }
    return d+'Z';
  }
  const n=8, spread=150, startAngle=-90-spread/2;
  for(let i=0;i<n;i++){
    const ang=(startAngle + (spread/(n-1))*i) * Math.PI/180;
    const cx=Math.cos(ang)*55, cy=Math.sin(ang)*55 - 5;
    g.appendChild(el('path',{d:star(cx,cy,6.2),fill:'#FFFFFF'}));
  }
})();

// ── USA: 13 franjas + 50 estrellas ──
(function(){
  const g=document.getElementById('stripes-us');
  const h=200/13;
  for(let i=0;i<13;i++){
    if(i%2===1) g.appendChild(el('rect',{x:0,y:i*h,width:300,height:h,fill:'#FFFFFF'}));
  }
  const gs=document.getElementById('stars-us');
  function star(cx,cy,r){
    let d='';
    for(let i=0;i<10;i++){
      const a=(i/10)*2*Math.PI - Math.PI/2;
      const rad = i%2===0 ? r : r*0.42;
      const x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad;
      d+=(i===0?'M':'L')+x.toFixed(2)+','+y.toFixed(2)+' ';
    }
    return d+'Z';
  }
  const rows=9, cols6=6, cols5=5;
  const top=10, bottom=98, left=8, right=112;
  for(let r=0;r<rows;r++){
    const cols = r%2===0 ? cols6 : cols5;
    const y = top + (bottom-top)*(r/(rows-1));
    const xOffset = r%2===0 ? left : left + (right-left)/(cols6-1)/2;
    for(let c=0;c<cols;c++){
      const x = r%2===0
        ? left + (right-left)*(c/(cols6-1))
        : left + (right-left)/(cols6-1)/2 + (right-left-  (right-left)/(cols6-1))*(c/(cols5-1));
      gs.appendChild(el('path',{d:star(x,y,2.6),fill:'#FFFFFF'}));
    }
  }
})();

// ── San Marino: escudo simplificado con 3 torres ──
(function(){
  const g=document.getElementById('crest-sm');
  g.appendChild(el('path',{d:'M -18 -14 Q 0 -22 18 -14 L 18 6 Q 18 20 0 26 Q -18 20 -18 6 Z',fill:'#DCEBF5',stroke:'#B08D2B','stroke-width':1.6}));
  function tower(x,y,s){
    const t=el('g',{transform:`translate(${x},${y}) scale(${s})`});
    t.appendChild(el('rect',{x:-4,y:-2,width:8,height:12,fill:'#FFFFFF',stroke:'#4a5568','stroke-width':0.6}));
    t.appendChild(el('polygon',{points:'-5,-2 0,-9 5,-2',fill:'#FFFFFF',stroke:'#4a5568','stroke-width':0.6}));
    t.appendChild(el('rect',{x:-1,y:-9,width:2,height:4,fill:'#FFFFFF',stroke:'#4a5568','stroke-width':0.4}));
    return t;
  }
  g.appendChild(el('path',{d:'M -18 6 Q -9 -2 0 4 Q 9 -2 18 6 L 18 6 Q 18 20 0 26 Q -18 20 -18 6 Z',fill:'#7FBF7F'}));
  g.appendChild(tower(-9,-2,0.95));
  g.appendChild(tower(0,-6,1.1));
  g.appendChild(tower(9,-2,0.95));
  g.appendChild(el('path',{d:'M -13 -18 Q 0 -28 13 -18 L 10 -18 Q 0 -24 -10 -18 Z',fill:'#F0C419',stroke:'#8a6d10','stroke-width':0.6}));
  g.appendChild(el('circle',{cx:0,cy:-24,r:2.4,fill:'#F0C419',stroke:'#8a6d10','stroke-width':0.6}));
})();
</script>
