<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F0F4F8;--surface:#fff;--border:#E2E8F0;--text:#1A202C;--t2:#4A5568;--t3:#94A3B8;--pri:#006B99;--pri-d:#005580;--pri-l:#EBF8FF;--radius:8px;--rlg:12px;--shadow:0 1px 3px rgba(0,0,0,.07)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
header{background:#6B0F1A;color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:12px;height:52px;position:sticky;top:0;z-index:10}
nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;justify-content:center;padding:10px 16px;gap:6px;overflow-x:auto;position:sticky;top:52px;z-index:9}
nav button{background:none;border:1px solid transparent;border-radius:20px;color:var(--t2);cursor:pointer;font:13px/1 inherit;font-weight:500;padding:7px 18px;white-space:nowrap;transition:all .15s}
nav button.on{background:#6B0F1A;border-color:#6B0F1A;color:#fff;font-weight:600}
nav button:hover:not(.on){background:var(--bg);border-color:var(--border);color:var(--text)}
main{max-width:1280px;margin:0 auto;padding:20px 24px}
label{display:block;font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font:14px inherit;color:var(--text);background:var(--surface);transition:border .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
textarea{resize:vertical;min-height:60px}
.btn{border:none;border-radius:var(--radius);cursor:pointer;font:13px/1 inherit;font-weight:600;padding:8px 16px;transition:all .15s}
.bp{background:#006B99;color:#fff}.bp:hover{background:#005580}
.bg{background:#D1FAE5;color:#065F46}.bg:hover{background:#A7F3D0}
.bd{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;cursor:pointer;border-radius:var(--radius);padding:5px 9px;font-size:12px}.bd:hover{background:#FEE2E2}
.bi{background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--t3);cursor:pointer;padding:5px 9px;font-size:14px;transition:all .15s}.bi:hover{background:var(--bg);color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.ch{background:#F7F8FA;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cb{padding:14px 16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mono{font-feature-settings:'tnum'}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.b-masc{background:#DCFCE7;color:#15803D}
.b-fem{background:#FCE7F3;color:#9D174D}
.status{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.s-load{background:#EFF6FF;color:#1D4ED8}.s-ok{background:#F0FDF4;color:#15803D}.s-err{background:#FEF2F2;color:#DC2626}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--t3)}
.empty h3{font-size:16px;color:var(--t2);margin-bottom:8px}
.empty svg{margin:0 auto 14px;display:block;opacity:.35}
/* Partido cards */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow);display:grid;grid-template-columns:5px 1fr}

.ptable-wrap{background:#FAFBFC;border:1px solid var(--border);border-radius:var(--rlg);overflow-x:auto;margin-bottom:16px}
.ptable td.pcrew{white-space:nowrap}
.ptable{border-collapse:collapse;width:100%}
.ptable th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--t3);padding:8px 10px 6px;border-bottom:1px solid var(--border)}
.ptable td{padding:8px 10px;font-size:12.5px;color:var(--t1);border-bottom:1px solid var(--border);vertical-align:middle}
.ptable tbody tr:hover td{background:#F8FAFC}
.ptable tr.newday td{border-top:2px solid var(--border)}
.ptable .pnum{font-variant-numeric:tabular-nums;text-align:right}
.ppill{display:inline-flex;align-items:baseline;gap:4px;border-radius:999px;padding:3px 9px 3px 7px;margin:2px 4px 2px 0;border:1.6px solid;cursor:pointer;user-select:none}
.ppill.nopago{cursor:default}
.ppill.adeuda{background:#FFFBEB;border-color:#F59E0B}
.ppill.pagado{background:#F0FDF4;border-color:#16A34A}
.ppill.nopago{background:#F8FAFC;border-color:var(--border)}
.ppill .pdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ppill.r-coord .pdot{background:#1D4ED8}
.ppill.r-oper .pdot{background:#D97706}
.ppill.r-perio .pdot{background:#0D9488}
.ppill .pnom{font-size:12.5px;font-weight:700;color:var(--t1)}
.ppill .pmon{font-size:10px;color:var(--t3)}
.ppill .ppaga{font-size:9px;color:var(--t3)}
tr.obsrow td{border-top:none;padding:0 10px 8px}
tr.obsrow:hover td{background:transparent!important}
tr.haswarn td{border-bottom:none!important}
.pobs{display:flex;align-items:flex-start;gap:7px;border-radius:7px;padding:6px 10px;font-size:11px;line-height:1.4}
.pobs .ic{font-size:15px;line-height:1.1;flex-shrink:0}
.pcard-stripe{width:5px}
.pcard-body{padding:12px 16px}
.pcard-top{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin-bottom:10px}
.pcard-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.pcard-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px}
.pcard-num{font-size:11px;color:var(--t3);font-weight:600;font-feature-settings:'tnum'}
.pcard-fecha{font-size:12px;color:var(--t3)}
.pcard-nombre{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-fin-item{display:flex;flex-direction:column;background:#F7F8FA;border:1px solid var(--border);border-radius:8px;padding:5px 12px;min-width:100px;text-align:right}
.pcard-fin-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:1px}
.pcard-fin-val{font-size:14px;font-weight:700;font-feature-settings:'tnum'}
.pcard-eq{display:flex;flex-wrap:wrap;gap:6px}
.pcard-chip{background:#F7F8FA;border:1px solid var(--border);border-radius:6px;padding:5px 10px;display:flex;align-items:center;gap:8px}
.pcard-chip.pagado{background:#F0FDF4;border-color:#BBF7D0}
.pcard-chip-rol{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);white-space:nowrap}
.pcard-chip-nom{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap}
.pcard-chip-mon{font-size:12px;color:#059669;font-weight:700;font-feature-settings:'tnum';white-space:nowrap;margin-left:auto}
.pcard-chip-sep{width:1px;background:var(--border);height:14px;flex-shrink:0}
.pcard-chip-pago{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;white-space:nowrap}
.pago-ok{background:#DCFCE7;color:#15803D}
.pago-no{background:#FEF9C3;color:#854D0E}
.pcard-obs{margin-top:8px;padding:8px 12px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:6px;font-size:12px;color:#92400E}
/* Liq */
.lrow{display:grid;grid-template-columns:60px 1fr auto auto;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);font-size:13px}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:#F8FAFC}
.respon-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--rlg);overflow:hidden;margin-bottom:16px;box-shadow:var(--shadow)}
.respon-head{background:#F7F8FA;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr 1fr}.lrow{grid-template-columns:45px 1fr 80px}}
@media print{header,nav,.btn,.bi,.bd,.print-hide{display:none!important}main{padding:0}.card{box-shadow:none}}






.pin-inputs{display:flex;gap:10px;justify-content:center;margin-bottom:24px}
.pin-inputs input{width:40px;height:52px;border:2px solid #E2E8F0;border-radius:10px;text-align:center;font-size:24px;font-weight:700;color:#1A202C;background:#F7F8FA}
.pin-inputs input:focus{border-color:#006B99;outline:none;background:white}

</style>
</head>

<script>
(function(){
  var PASS='Maradona.10';
  var ok=sessionStorage.getItem('veterAuth')===PASS;
  while(!ok){
    var input=prompt('Veter — Passphrase de acceso:');
    if(input===null){location.href='about:blank';throw new Error('cancelado');}
    if(input===PASS){sessionStorage.setItem('veterAuth',PASS);ok=true;}
    else alert('Passphrase incorrecta.');
  }
  window.VETER_TOKEN=PASS;
})();
</script>

  <button class="on" onclick="goTab('partidos')">Partidos</button>
  <button onclick="goTab('liq')">Liquidación</button>

  <button onclick="goTab('gastos')">Gastos</button>
  <button onclick="goTab('config')">Config</button>
</nav>

<main id="main"></main>

<script>
// ── CONSTANTES ────────────────────────────────────────────────────────────
const TIPOS = ['MASCULINO','FEMENINO'];
const INGRESO_DEF = {MASCULINO:425, FEMENINO:350};
const STRIPE = {MASCULINO:'#22C55E', FEMENINO:'#EC4899'};
const BADGE_CLS = {MASCULINO:'b-masc', FEMENINO:'b-fem'};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ── ESTADO ────────────────────────────────────────────────────────────────
// PERSONAS: {nombre: {monto, pagaA, rol}}
// rol: 'COORD' | 'OPERADOR' | 'PERIO'
let PERSONAS = {};

let ST = {
  tab:'partidos', partidos:[], url:localStorage.getItem('gasUrlVzla')||'',
  loading:false, err:null, form:null,
  lResponsable:'', lMes:'',
  filtroTipos: new Set(),
  collapsedMeses: new Set(),
  verDeuda: false,
  gastos: []   // [{id, tipo:'unico'|'recurrente', fecha, descripcion, categoria, monto, mesDesde}]
};

// ── HELPERS ───────────────────────────────────────────────────────────────
const fmt = n => n ? '$' + Number(n).toLocaleString('es-AR',{maximumFractionDigits:0}) : '–';
const fmtI = n => (n||n===0)&&n!=='' ? Number(n).toLocaleString('es-AR',{maximumFractionDigits:0}) : '';
const parseI = s => parseInt(String(s).replace(/\./g,'').replace(/,.*$/,''))||0;
const fmtF = s => {
  if(!s)return'';
  // Handle yyyy-MM-dd
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[3]+'/'+m[2];
  // Fallback
  const d = new Date(s);
  if(isNaN(d)) return s;
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
};
const getMes = f => { if(!f)return''; const m=String(f).match(/^(\d{4}-\d{2})/); return m?m[1]:''; };
const mesLbl = ym => { if(!ym)return''; const[y,m]=ym.split('-'); return MESES[+m-1]+' '+y; };

function onMoney(el){
  const raw = el.value.replace(/[^\d]/g,'');
  const num = parseInt(raw)||'';
  el.value = num!=='' ? Number(num).toLocaleString('es-AR',{maximumFractionDigits:0}) : '';
}

function setSt(type, msg){
  const el = document.getElementById('sync');
  if(!el)return;
  el.textContent = msg;
  el.style.background = type==='ok' ? 'rgba(209,250,229,.3)' : type==='err' ? 'rgba(254,226,226,.3)' : 'rgba(255,255,255,.15)';
}

// ── API ───────────────────────────────────────────────────────────────────
async function apiPost(data){
  const r = await fetch(ST.url, {method:'POST', body:JSON.stringify({...data, token:window.VETER_TOKEN||''})});
  const j = await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}

async function loadData(){
  if(!ST.url){ render(); return; }
  ST.loading=true; setSt('load','↻ cargando...'); render();
  try{
    const j = await apiPost({action:'getAll'});
    ST.partidos = (j.partidos||[]).reverse();
    autoNumerar();
    const tar = j.tarifas||{};
    PERSONAS = tar.__personas||{};
    ST.gastos = tar.__gastos||[];
    setSt('ok','⬤ conectado');
  } catch(e){ ST.err='Error al cargar: '+e.message; setSt('err','⬤ error'); }
  ST.loading=false; render();
}

// ── NAVEGACIÓN ────────────────────────────────────────────────────────────
const navEl = document.getElementById('nav');
const main  = document.getElementById('main');
function goTab(t){
  ST.tab=t; ST.form=null;
  [...navEl.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',['partidos','liq','balances','gastos','config'][i]===t));
  render();
}
function render(){
  if(ST.tab==='partidos') rPartidos();
  else if(ST.tab==='form') rForm();
  else if(ST.tab==='liq') rLiq();
  else if(ST.tab==='balances') rBalances();
  else if(ST.tab==='gastos') rGastos();
  else rConfig();
}

// ── PARTIDOS ──────────────────────────────────────────────────────────────
function rPartidos(){
  if(!ST.url){ main.innerHTML=noUrl(); return; }

  const tiposPresentes = [...new Set(ST.partidos.map(p=>p.tipo))].filter(Boolean);
  const filtro = ST.filtroTipos;
  const listaRaw = filtro.size===0 ? ST.partidos : ST.partidos.filter(p=>filtro.has(p.tipo));
  const lista = [...listaRaw].sort((a,b)=>{
    const fa=(a.fecha||'')+(a.hora||''); const fb=(b.fecha||'')+(b.hora||'');
    return fb.localeCompare(fa); // más reciente primero
  });

  const filterBar = tiposPresentes.length>1 ? `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-bottom:12px">
    <span style="font-size:11px;color:var(--t3);font-weight:600">Filtrar:</span>
    <button onclick="ST.filtroTipos=new Set();render()" style="border:1px solid ${filtro.size===0?'var(--pri)':'var(--border)'};background:${filtro.size===0?'var(--pri-l)':'var(--surface)'};color:${filtro.size===0?'var(--pri)':'var(--t2)'};border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600;cursor:pointer">Todos</button>
    ${tiposPresentes.map(t=>{const on=filtro.has(t);return`<button onclick="toggleFiltro('${t}')" class="badge ${BADGE_CLS[t]||'badge'}" style="padding:4px 12px;font-size:12px;cursor:pointer;border:2px solid ${on?'currentColor':'transparent'};opacity:${on?1:.6}">${t}</button>`;}).join('')}
  </div>` : '';

  let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px" class="print-hide">
    <span style="font-size:13px;color:var(--t3)">${lista.length}${filtro.size?'/'+ST.partidos.length:''} partido${ST.partidos.length!==1?'s':''}</span>
    <button class="btn bp" onclick="openNew()">+ Nuevo partido</button>
  </div>${filterBar}`;

  if(ST.loading) h+=`<div class="status s-load"><span class="spin">↻</span> Cargando...</div>`;
  if(ST.err) h+=`<div class="status s-err">⚠ ${ST.err}</div>`;
  if(lista.length===0&&!ST.loading){ h+=`<div class="empty"><svg width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 01-1.125-1.125M3.375 19.5h1.5C5.496 19.5 6 18.996 6 18.375m-3.75.125v-1.875m0 0a1.125 1.125 0 011.125-1.125h1.5a1.125 1.125 0 011.125 1.125M3.375 16.5v-1.5M21 16.5v-1.5m0 0a1.125 1.125 0 00-1.125-1.125h-1.5A1.125 1.125 0 0017.25 15m3.75 1.5V15"/></svg><h3>Sin partidos cargados</h3><p>Clic en "+ Nuevo partido" para agregar el primero.</p></div>`; main.innerHTML=h; return; }

  // Add toggleMes function inline context
  let curMes = null, curDia = null, tableOpen = false;
  const closeTable=()=>{ if(tableOpen){ h+='</tbody></table></div>'; tableOpen=false; } };
  lista.forEach(p=>{
    const mes = getMes(p.fecha);
    if(mes !== curMes){
      closeTable();
      curMes = mes; curDia = null;
      const collapsed = ST.collapsedMeses.has(mes);
      const isOld = mes < getMes(new Date().toISOString());
      h += `<div style="display:flex;align-items:center;gap:10px;margin:${h.length>200?'20px':'0px'} 0 10px">
        <div style="flex:1;height:2px;background:linear-gradient(to right,#006B99,#CBD5E1)"></div>
        <button onclick="toggleMes('${mes}')" style="background:${collapsed?'#006B99':'var(--surface)'};color:${collapsed?'white':'#006B99'};border:2px solid #006B99;border-radius:20px;padding:5px 16px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px">
          ${mesLbl(mes)||'Sin fecha'}
          <span style="font-size:11px;opacity:.7">${collapsed?'▶':'▼'}</span>
        </button>
        <button onclick="exportMes('${mes}')" title="Exportar informe ${mesLbl(mes)}" style="background:var(--surface);color:#475569;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">
          📄 PDF para facturación
        </button>
        <div style="flex:1;height:2px;background:linear-gradient(to left,#006B99,#CBD5E1)"></div>
      </div>`;
      if(collapsed){ return; }
    }
    if(ST.collapsedMeses.has(mes)) return;

    if(!tableOpen){
      h += `<div class="ptable-wrap"><table class="ptable"><thead><tr>
        <th style="width:70px">Fecha</th><th>Partido</th>
        <th style="width:58px" class="pnum">Costo</th><th style="width:62px" class="pnum">Ingreso</th><th style="width:58px" class="pnum">Marg.</th>
        <th>Crew</th><th style="width:70px"></th>
      </tr></thead><tbody>`;
      tableOpen = true;
    }

    const eq = p.equipo||[];
    const costo = eq.reduce((s,e)=>s+(+e.monto||0)+((e.extras||[]).reduce((a,x)=>a+(+x.monto||0),0)),0);
    const ing = +p.ingreso||0;
    const margen = ing-costo;
    const mc = margen>=0?'#059669':'#DC2626';

    const newDay = p.fecha!==curDia; curDia = p.fecha;

    const chips = eq.map((e,i)=>({e,i})).filter(x=>x.e.nombre).map(({e,i:ei})=>{
      const pagaA = (PERSONAS[e.nombre]||{}).pagaA||e.nombre;
      const pagaCorto = pagaA.trim().split(/\s+/).pop();
      const pagaInfo = pagaA!==e.nombre ? `<span class="ppaga">→${pagaCorto}</span>` : '';
      const extrasTotal = (e.extras||[]).reduce((a,x)=>a+(+x.monto||0),0);
      const totalMonto = (+e.monto||0)+extrasTotal;
      const esCoord = e.rol==='COORD';
      const rolCls = e.rol==='COORD'?'r-coord':e.rol==='OPERADOR'?'r-oper':'r-perio';
      const statusClass = esCoord?'nopago':(e.pagado?'pagado':'adeuda');
      const onclick = esCoord?'':` onclick="togglePagoChip('${p.id}',${ei})"`;
      const extraTxt = (e.extras||[]).length ? ' +'+(e.extras||[]).map(x=>x.tipo).join(',') : '';
      return `<span class="ppill ${rolCls} ${statusClass}"${onclick} title="${e.pagado?'Pagado — clic para marcar como adeuda':'Adeuda — clic para marcar como pagado'}">
        <span class="pdot"></span><span class="pnom">${e.nombre}</span>${pagaInfo}<span class="pmon">${fmt(totalMonto)}${extraTxt}</span>
      </span>`;
    }).join('');

    const ingNum = +p.ingreso||0;
    const isTest = /test/i.test(p.partido||'');
    const grave = !isTest && ingNum<=349;
    const obsBg = grave ? '#FEF2F2' : '#FFFBEB';
    const obsBorder = grave ? '#FCA5A5' : '#FDE68A';
    const obsColor = grave ? '#B91C1C' : '#92400E';
    const autoAlert = (!isTest && ingNum===0) ? 'Sin ingreso registrado' : '';
    const obsText = p.observaciones || autoAlert;

    h += `<tr${newDay?' class="newday"':''}${obsText?' class="haswarn"':''}>
      <td style="white-space:nowrap"><span class="badge ${BADGE_CLS[p.tipo]||''}" style="font-size:9px;padding:2px 6px">${p.tipo}</span> ${fmtF(p.fecha)}${p.hora?' · '+p.hora:''}</td>
      <td style="font-weight:700">${p.partido}</td>
      <td class="pnum" style="color:#DC2626;font-weight:700">${fmt(costo)}</td>
      <td class="pnum" style="color:#2563EB;font-weight:700">${fmt(ing)}</td>
      <td class="pnum" style="color:${mc};font-weight:700">${margen>=0?'+':''}${fmt(margen)}</td>
      <td class="pcrew">${chips}</td>
      <td class="print-hide" style="white-space:nowrap"><button class="bi" onclick="openEdit('${p.id}')" title="Editar">✎</button><button class="bd" onclick="delP('${p.id}')" title="Eliminar">✕</button></td>
    </tr>
    ${obsText?`<tr class="obsrow"><td colspan="7"><div class="pobs" style="background:${obsBg};border:1px solid ${obsBorder};color:${obsColor}"><span class="ic">⚠</span><span>${obsText}</span></div></td></tr>`:''}`;
  });
  closeTable();
  main.innerHTML=h;
}

function autoNumerar(){
  // Sort all by fecha+hora asc, assign sequential numbers
  const sorted = [...ST.partidos].sort((a,b)=>{
    const fa=(a.fecha||'')+(a.hora||''); const fb=(b.fecha||'')+(b.hora||'');
    return fa.localeCompare(fb);
  });
  sorted.forEach((p,i)=>{ p.num = String(i+1); });
}
function toggleMes(mes){
  if(ST.collapsedMeses.has(mes)) ST.collapsedMeses.delete(mes);
  else ST.collapsedMeses.add(mes);
  render();
}
function toggleFiltro(tipo){
  if(ST.filtroTipos.has(tipo)) ST.filtroTipos.delete(tipo);
  else ST.filtroTipos.add(tipo);
  render();
}

// ── FORM ──────────────────────────────────────────────────────────────────
function openNew(){
  ST.form={id:null,num:'',fecha:new Date().toISOString().slice(0,10),hora:'',tipo:'MASCULINO',partido:'',ingreso:INGRESO_DEF.MASCULINO,observaciones:'',equipo:[]};
  buildEquipo();
  ST.tab='form'; [...navEl.querySelectorAll('button')].forEach(b=>b.classList.remove('on')); render();
}
function openEdit(id){
  const p = ST.partidos.find(x=>x.id===id); if(!p)return;
  ST.form = JSON.parse(JSON.stringify(p));
  ST.tab='form'; [...navEl.querySelectorAll('button')].forEach(b=>b.classList.remove('on')); render();
}
function cancelF(){ ST.form=null; ST.tab='partidos'; [...navEl.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('on',i===0)); render(); }

function buildEquipo(){
  const tipo = ST.form.tipo;
  const roles = tipo==='FEMENINO' ? ['COORD','OPERADOR'] : ['COORD','OPERADOR','PERIO'];
  const coordPer = Object.entries(PERSONAS).find(([n,p])=>p.rol==='COORD');
  ST.form.equipo = roles.map(rol=>{
    const existing = (ST.form.equipo||[]).find(e=>e.rol===rol);
    if(existing) return existing;
    if(rol==='COORD'){
      const nombre = coordPer?coordPer[0]:'HEIDY';
      const monto = coordPer?coordPer[1].monto:25;
      return {rol, nombre, monto, pagado:false};
    }
    return {rol, nombre:'', monto:0, pagado:false};
  });
}

function onTipoChange(val){
  ST.form.tipo=val;
  ST.form.ingreso=INGRESO_DEF[val]||0;
  buildEquipo();
  render();
}

function setEq(i, field, val){
  if(!ST.form.equipo[i]) return;
  ST.form.equipo[i][field] = val;
  if(field==='nombre'){
    const p = PERSONAS[val];
    if(p && !ST.form.equipo[i]._montoEditado) ST.form.equipo[i].monto = p.monto;
  }
  if(field==='monto') ST.form.equipo[i]._montoEditado=true;
}
function addExtra(i){
  if(!ST.form.equipo[i]) return;
  if(!ST.form.equipo[i].extras) ST.form.equipo[i].extras=[];
  ST.form.equipo[i].extras.push({tipo:'4G',monto:0});
  render();
}
function setExtra(i,j,field,val){
  if(!ST.form.equipo[i]||!ST.form.equipo[i].extras) return;
  ST.form.equipo[i].extras[j][field]=val;
}
function removeExtra(i,j){
  if(!ST.form.equipo[i]||!ST.form.equipo[i].extras) return;
  ST.form.equipo[i].extras.splice(j,1);
  render();
}

function rForm(){
  const f = ST.form;
  const roles = f.tipo==='FEMENINO' ? ['COORD','OPERADOR'] : ['COORD','OPERADOR','PERIO'];
  const operadores = Object.entries(PERSONAS).filter(([,p])=>p.rol==='OPERADOR').map(([n])=>n).sort();
  const perios = Object.entries(PERSONAS).filter(([,p])=>p.rol==='PERIO').map(([n])=>n).sort();
  const coords = Object.entries(PERSONAS).filter(([,p])=>p.rol==='COORD').map(([n])=>n).sort();

  const eqHtml = f.equipo.map((e,i)=>{
    const isCoord = e.rol==='COORD';
    const pool = e.rol==='PERIO' ? perios : e.rol==='COORD' ? coords : operadores;
    const pagaA = e.nombre && PERSONAS[e.nombre] ? PERSONAS[e.nombre].pagaA : '';
    const pagaInfo = pagaA && pagaA!==e.nombre ? `<span style="font-size:11px;color:var(--t3);margin-top:4px;display:block">Paga a: <strong>${pagaA}</strong></span>` : '';
    return `<div style="background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:12px">
      <label>${e.rol}</label>
      <div style="display:grid;grid-template-columns:1fr 130px 110px;gap:8px;align-items:end">
        <div>
          <select onchange="setEq(${i},'nombre',this.value);render()">
            <option value="">— elegir —</option>
            ${pool.map(n=>`<option value="${n}"${e.nombre===n?' selected':''}>${n}</option>`).join('')}
          </select>
          ${pagaInfo}
        </div>
        <div><label>Monto</label><input type="text" inputmode="numeric" value="${fmtI(e.monto)}" oninput="onMoney(this)" onchange="setEq(${i},'monto',parseI(this.value))"></div>
      </div>
      ${(e.extras||[]).map((ex,j)=>`
      <div style="display:grid;grid-template-columns:140px 110px auto;gap:6px;align-items:end;margin-top:8px">
        <div><label>Tipo extra</label><select onchange="setExtra(${i},${j},'tipo',this.value)">
          <option${ex.tipo==='4G'?' selected':''}>4G</option>
          <option${ex.tipo==='STARLINK'?' selected':''}>STARLINK</option>
          <option${ex.tipo==='MOVILIDAD'?' selected':''}>MOVILIDAD</option>
          <option${ex.tipo==='OTRO'?' selected':''}>OTRO</option>
        </select></div>
        <div><label>Monto</label><input type="text" inputmode="numeric" value="${fmtI(ex.monto)}" oninput="onMoney(this)" onchange="setExtra(${i},${j},'monto',parseI(this.value))"></div>
        <button class="bd" onclick="removeExtra(${i},${j})" style="align-self:flex-end">✕</button>
      </div>`).join('')}
      <button onclick="addExtra(${i})" style="margin-top:8px;background:none;border:1px dashed var(--border);border-radius:6px;padding:4px 12px;font-size:12px;color:var(--t3);cursor:pointer;width:100%">+ Agregar extra</button>
    </div>`;
  }).join('');

  main.innerHTML=`<div class="card" style="max-width:900px;margin:0 auto"><div class="ch"><strong>${f.id?'Editar':'Nuevo'} partido</strong></div><div class="cb">
    <div style="display:grid;grid-template-columns:150px 110px 150px 130px;gap:10px;margin-bottom:12px">
      <div><label>Fecha</label><input type="date" value="${f.fecha||''}" onchange="ST.form.fecha=this.value"></div>

async function saveP(){
  const f = ST.form;
  if(!f.partido.trim()){ alert('Completá el nombre del partido.'); return; }
  // Deshabilitar botón para evitar doble click
  const btn = document.querySelector('button[onclick="saveP()"]');
  if(btn){ btn.disabled=true; btn.textContent='⏳ Guardando...'; btn.style.opacity='.6'; }
  setSt('load','↻ guardando...');
  try{
    const r = await apiPost({action: f.id?'updatePartido':'addPartido', partido:f});
    if(f.id){ const i=ST.partidos.findIndex(x=>x.id===f.id); if(i>=0) ST.partidos[i]=r.partido||f; }
    else ST.partidos.unshift(r.partido||f);
    autoNumerar();
    setSt('ok','⬤ guardado'); cancelF();
  } catch(e){
    setSt('err','⬤ error'); alert('Error al guardar: '+e.message);
    if(btn){ btn.disabled=false; btn.textContent='💾 Guardar partido'; btn.style.opacity='1'; }
  }
}

async function delP(id){
  if(!confirm('¿Eliminar este partido?')) return;
  setSt('load','↻ eliminando...');
  try{
    await apiPost({action:'deletePartido', id});
    ST.partidos = ST.partidos.filter(p=>p.id!==id);
    setSt('ok','⬤ listo'); render();
  } catch(e){ setSt('err','⬤ error'); }
}

// ── BALANCES ──────────────────────────────────────────────────────────────
function gastosDelMes(mes){
  // Gastos únicos: solo si su fecha cae en ese mes
  const unicos = ST.gastos.filter(g=>g.tipo==='unico'&&getMes(g.fecha)===mes);
  // Recurrentes: activos si mesDesde <= mes
  const recurrentes = ST.gastos.filter(g=>g.tipo==='recurrente'&&g.mesDesde&&g.mesDesde<=mes);
  const totalUnicos = unicos.reduce((s,g)=>s+(+g.monto||0),0);
  const totalRec = recurrentes.reduce((s,g)=>s+(+g.monto||0),0);
  return {unicos, recurrentes, total: totalUnicos+totalRec};
}

function getTotalInversion(){
  return ST.gastos.filter(g=>g.tipo==='inversion').reduce((s,g)=>s+(+g.monto||0),0);
}
function rBalances(){
  if(!ST.url){ main.innerHTML=noUrl(); return; }
  const byMes={};
  ST.partidos.forEach(p=>{
    const mes=getMes(p.fecha); if(!mes)return;
    if(!byMes[mes])byMes[mes]=[];
    byMes[mes].push(p);
  });
  const meses=Object.keys(byMes).sort().reverse();
  if(meses.length===0&&!ST.loading){ main.innerHTML=`<div class="empty"><h3>Sin datos todavía</h3><p>Cargá partidos primero.</p></div>`; return; }

  let totIng=0,totCosto=0,totGastos=0,totP=0;

      const ing=+p.ingreso||0;
      mIng+=ing; mCosto+=costo;
      if(!byTipo[p.tipo])byTipo[p.tipo]={count:0,ing:0,costo:0};
      byTipo[p.tipo].count++; byTipo[p.tipo].ing+=ing; byTipo[p.tipo].costo+=costo;
    });
    // Gastos operativos del mes
    const gm = gastosDelMes(mes);
    const mGastos = gm.total;
    totIng+=mIng; totCosto+=mCosto; totGastos+=mGastos; totP+=ps.length;
    const mar=mIng-mCosto; // margen bruto
    const util=mar-mGastos; // utilidad real
    const mc=mar>=0?'#059669':'#DC2626';

    ].join('');

    h+=`<div class="card" style="margin-bottom:14px">
      <div class="ch" style="justify-content:space-between">
        <strong style="font-size:15px">${mesLbl(mes)}</strong>
        <span style="font-size:12px;color:var(--t3)">${ps.length} partido${ps.length!==1?'s':''}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(${mGastos?4:3},1fr)">
        <div style="padding:14px 18px;border-right:1px solid var(--border)"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">Ingreso</div><div style="font-size:20px;font-weight:700;color:#059669;font-feature-settings:'tnum'">${fmt(mIng)}</div></div>
        <div style="padding:14px 18px;border-right:1px solid var(--border)"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">Costo equipo</div><div style="font-size:20px;font-weight:700;color:#DC2626;font-feature-settings:'tnum'">${fmt(mCosto)}</div></div>
        ${mGastos?`<div style="padding:14px 18px;border-right:1px solid var(--border)"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">Gastos op.</div><div style="font-size:20px;font-weight:700;color:#DC2626;font-feature-settings:'tnum'">-${fmt(mGastos)}</div></div>`:''}
        <div style="padding:14px 18px"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">Utilidad <span style="font-weight:400">(${pct}%)</span></div><div style="font-size:20px;font-weight:700;color:${uc};font-feature-settings:'tnum'">${util>=0?'+':''}${fmt(util)}</div></div>
      </div>
      ${gastoTags?`<div style="padding:10px 16px;display:flex;flex-wrap:wrap;gap:7px;border-top:1px solid var(--border)">${gastoTags}</div>`:''}
    </div>`;
  });

  const totMar=totIng-totCosto;
  const totInversion=getTotalInversion();
  const totUtil=totMar-totGastos-totInversion;
  const totPct=totIng>0?Math.round(totUtil/totIng*100):0;
  const balCols=totInversion>0?5:(totGastos>0?4:3);
  const summary=`<div class="card" style="margin-bottom:20px;border-color:var(--pri)">
    <div class="ch" style="background:var(--pri-l);justify-content:space-between">
      <strong>Total acumulado — ${meses.length} mes${meses.length!==1?'es':''}</strong>
      <span style="font-size:12px;color:var(--t3)">${totP} partidos</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(${balCols},1fr)">
      <div style="padding:16px 18px;border-right:1px solid var(--border)"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;margin-bottom:6px">Ingreso total</div><div style="font-size:24px;font-weight:700;color:#059669;font-feature-settings:'tnum'">${fmt(totIng)}</div></div>
      <div style="padding:16px 18px;border-right:1px solid var(--border)"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;margin-bottom:6px">Costo equipo</div><div style="font-size:24px;font-weight:700;color:#DC2626;font-feature-settings:'tnum'">${fmt(totCosto)}</div></div>
      ${totGastos?`<div style="padding:16px 18px;border-right:1px solid var(--border)"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;margin-bottom:6px">Gastos op.</div><div style="font-size:24px;font-weight:700;color:#DC2626;font-feature-settings:'tnum'">-${fmt(totGastos)}</div></div>`:''}
      ${totInversion?`<div style="padding:16px 18px;border-right:1px solid var(--border)"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;margin-bottom:6px">Inversión</div><div style="font-size:22px;font-weight:700;color:#7C3AED;font-feature-settings:'tnum'">-$${totInversion.toLocaleString('es-AR')}</div></div>`:''}
      <div style="padding:16px 18px"><div style="font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;margin-bottom:6px">Utilidad total <span style="font-size:10px;font-weight:400">(${totPct}%)</span></div><div style="font-size:22px;font-weight:700;color:${totUtil>=0?'#059669':'#DC2626'};font-feature-settings:'tnum'">${totUtil>=0?'+':''}${fmt(totUtil)}</div></div>
    </div>
  </div>`;
  main.innerHTML=summary+h;
}

// ── EXPORT MES ────────────────────────────────────────────────────────────
function exportMes(mes){
  if(!mes){ alert('Elegí un mes para exportar.'); return; }
  const ps = ST.partidos
    .filter(p=>getMes(p.fecha)===mes && !/^test/i.test(p.partido||''))
    .sort((a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')));
  if(!ps.length){ alert('No hay partidos en ese mes.'); return; }

  let totIng = 0;
  const DEF_ING = {MASCULINO:425, FEMENINO:350};
  const rows = ps.map((p,idx)=>{
    const ing = +p.ingreso||0;
    totIng += ing;
    const defIng = DEF_ING[p.tipo]||0;
    const montoDistinto = defIng && ing !== defIng;
    const obsHtml = p.observaciones
      ? `<div style="font-size:11px;margin-top:4px;${montoDistinto?'color:#B91C1C;font-weight:700;':'color:#92400E;'}">⚠ ${p.observaciones}</div>`
      : (montoDistinto ? `<div style="font-size:11px;margin-top:4px;color:#B91C1C;font-weight:700;">⚠ Importe distinto al estándar</div>` : '');
    const importeColor = montoDistinto ? '#B91C1C' : '#006B99';
    return `<tr style="background:${idx%2===0?'#fff':'#F8FAFC'}">
      <td style="padding:10px 12px;font-size:13px;white-space:nowrap;color:#64748B">${fmtF(p.fecha)}</td>
      <td style="padding:10px 12px;font-size:13px;font-weight:600">${p.partido}${obsHtml}</td>
      <td style="padding:10px 12px;text-align:center">
        <span style="background:${p.tipo==='FEMENINO'?'#FCE7F3':'#DCFCE7'};color:${p.tipo==='FEMENINO'?'#9D174D':'#15803D'};border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700">${p.tipo==='FEMENINO'?'FEM':'MASC'}</span>
      </td>
      <td style="padding:10px 12px;text-align:right;font-weight:800;font-size:15px;color:${importeColor};font-variant-numeric:tabular-nums">$${ing.toLocaleString('es-AR')}</td>
    </tr>`;
  }).join('');

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Informe ${mesLbl(mes)}</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:44px 48px;color:#1A202C;background:#fff}
    @media print{body{padding:24px 28px}}
    .header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;padding-bottom:16px;border-bottom:3px solid #006B99}
    .header h1{font-size:20px;font-weight:800;color:#006B99}
    .header p{font-size:12px;color:#64748B;margin-top:3px}
    .header .mes{font-size:18px;font-weight:700;color:#1A202C}
    table{width:100%;border-collapse:collapse;margin-bottom:20px}
    thead tr{border-bottom:2px solid #1E293B}
    thead th{padding:8px 12px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#64748B}
    thead th:last-child{text-align:right}
    thead th:nth-child(3){text-align:center}
    tbody tr:last-child td{border-bottom:2px solid #E2E8F0}
    .total-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;padding-top:16px;border-top:3px solid #1E293B}
    .total-partidos{font-size:13px;color:#64748B}
    .total-box{text-align:right}
    .total-box .lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#64748B;margin-bottom:4px}
    .total-box .val{font-size:28px;font-weight:800;color:#006B99;font-variant-numeric:tabular-nums}
    .footer{margin-top:36px;font-size:10px;color:#CBD5E1;text-align:center}
    .no-print{margin-top:24px;text-align:center}
    @media print{.no-print{display:none}}
  </style>
  </head><body>
  <div class="header">
    <div>
      <h1>Informe de transmisiones</h1>
      <p>Veter — Venezuela</p>
    </div>
    <div class="mes">${mesLbl(mes)}</div>
  </div>
  <table>
    <thead><tr>
      <th style="width:70px">Fecha</th>
      <th>Partido</th>
      <th style="width:70px;text-align:center">Tipo</th>
      <th style="width:100px;text-align:right">Importe</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="total-row">
    <div class="total-partidos">${ps.length} partido${ps.length!==1?'s':''}</div>
    <div class="total-box">
      <div class="lbl">Total del mes</div>
      <div class="val">$${totIng.toLocaleString('es-AR')}</div>
    </div>
  </div>
  <div class="footer">Admin Veter · ${new Date().toLocaleDateString('es-AR')}</div>
  <div class="no-print">
    <button onclick="window.print()" style="background:#006B99;color:white;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer">🖨 Guardar como PDF</button>
  </div>
  </body></html>`;

  const w = window.open('','_blank');
  w.document.write(html);
  w.document.close();
}

// ── GASTOS ───────────────────────────────────────────────────────────────
const CATS = ['Equipamiento','Licencias','Conectividad','Sueldos','Otro'];
const GCAT_COLOR = {Equipamiento:'#DBEAFE',Licencias:'#EDE9FE',Conectividad:'#DCFCE7',Sueldos:'#FEF9C3',Otro:'#F1F5F9'};
const GCAT_TEXT  = {Equipamiento:'#1D4ED8',Licencias:'#6D28D9',Conectividad:'#15803D',Sueldos:'#854D0E',Otro:'#475569'};

function rGastos(){
  if(!ST.url){ main.innerHTML=noUrl(); return; }

  const gastos = ST.gastos;
  // Form to add
  const formHtml = `<div class="card" style="margin-bottom:16px">
    <div class="ch"><strong>Agregar gasto</strong></div>
    <div class="cb">
      <div style="display:grid;grid-template-columns:140px 1fr 140px 130px auto;gap:10px;align-items:end;flex-wrap:wrap">
        <div><label>Tipo</label><select id="g-tipo" onchange="document.getElementById('g-fecha-wrap').style.display=(this.value==='unico'||this.value==='inversion')?'block':'none';document.getElementById('g-mesdesde-wrap').style.display=this.value==='recurrente'?'block':'none'">
          <option value="unico">Único</option>
          <option value="recurrente">Mensual</option>
        <option value="inversion">Inversión</option>
        </select></div>
        <div><label>Descripción</label><input id="g-desc" placeholder="Ej: Licencia vMix Basic" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"></div>
        <div><label>Categoría</label><select id="g-cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
        <div><label>Monto</label><input id="g-monto" type="text" inputmode="numeric" placeholder="0" oninput="onMoney(this)"></div>
        <button class="btn bp" onclick="addGasto()" style="white-space:nowrap;align-self:flex-end">+ Agregar</button>
      </div>
      <div style="display:grid;grid-template-columns:170px 170px;gap:10px;margin-top:10px">
        <div id="g-fecha-wrap"><label>Fecha</label><input id="g-fecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div id="g-mesdesde-wrap" style="display:none"><label>Desde mes</label><input id="g-mesdesde" type="month" value="${new Date().toISOString().slice(0,7)}"></div>
      </div>
    </div>
  </div>`;

  if(gastos.length===0){
    main.innerHTML = formHtml + `<div class="empty"><h3>Sin gastos cargados</h3><p>Agregá el primero arriba.</p></div>`;
    return;
  }

  // Group by tipo
  const unicos = gastos.filter(g=>g.tipo==='unico').sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const recurrentes = gastos.filter(g=>g.tipo==='recurrente');
  const inversiones = gastos.filter(g=>g.tipo==='inversion').sort((a,b)=>a.descripcion.localeCompare(b.descripcion));
  const totalUnicos = unicos.reduce((s,g)=>s+(+g.monto||0),0);
  const totalMensual = recurrentes.reduce((s,g)=>s+(+g.monto||0),0);

  const gRow = g => `<div style="display:grid;grid-template-columns:100px 1fr 130px 100px auto;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border)">
    <span style="font-size:12px;color:var(--t3)">${g.tipo==='unico'?fmtF(g.fecha):g.tipo==='inversion'?fmtF(g.fecha)||'Inversión':'Mensual'}</span>
    <span style="font-weight:600;font-size:13px">${g.descripcion}${g.tipo==='recurrente'?`<span style="font-size:10px;color:var(--t3);font-weight:400;margin-left:6px">desde ${mesLbl(g.mesDesde)}</span>`:''}</span>
    <span><span style="background:${GCAT_COLOR[g.categoria]||'#F1F5F9'};color:${GCAT_TEXT[g.categoria]||'#475569'};border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700">${g.categoria}</span></span>
    <span style="font-weight:700;color:#DC2626;font-feature-settings:'tnum';text-align:right">$${(+g.monto||0).toLocaleString('es-AR')}</span>
    <button class="bd" onclick="delGasto('${g.id}')">✕</button>
  </div>`;

  let body = '';
  if(inversiones.length){
    const totInv=inversiones.reduce((s,g)=>s+(+g.monto||0),0);
    body+=`<div class="card" style="margin-bottom:14px;border-color:#7C3AED"><div class="ch" style="background:#F5F3FF;justify-content:space-between"><strong style="color:#5B21B6">💼 Inversiones</strong><span style="color:#5B21B6;font-weight:700">$${totInv.toLocaleString('es-AR')}</span></div>${inversiones.map(gRow).join('')}</div>`;
  }
  if(unicos.length){
    body += `<div class="card" style="margin-bottom:14px">
      <div class="ch" style="justify-content:space-between"><strong>Gastos únicos</strong><span style="color:#DC2626;font-weight:700;font-feature-settings:'tnum'">$${totalUnicos.toLocaleString('es-AR')}</span></div>
      ${unicos.map(gRow).join('')}
    </div>`;
  }
  if(recurrentes.length){
    body += `<div class="card" style="margin-bottom:14px">
      <div class="ch" style="justify-content:space-between"><strong>Gastos mensuales recurrentes</strong><span style="color:#DC2626;font-weight:700;font-feature-settings:'tnum'">$${totalMensual.toLocaleString('es-AR')}/mes</span></div>
      ${recurrentes.map(gRow).join('')}
    </div>`;
  }

  main.innerHTML = formHtml + body;
}

function addGasto(){
  const tipo = document.getElementById('g-tipo')?.value||'unico';
  const desc = (document.getElementById('g-desc')?.value||'').trim();
  const cat  = document.getElementById('g-cat')?.value||'Otro';
  const monto= parseI(document.getElementById('g-monto')?.value||'0');
  const fecha= document.getElementById('g-fecha')?.value||'';
  const mesDesde = document.getElementById('g-mesdesde')?.value||'';
  if(!desc){ alert('Ingresá una descripción.'); return; }
  const g = {id:'g_'+Date.now(), tipo, descripcion:desc, categoria:cat, monto, fecha, mesDesde};
  ST.gastos.push(g);
  saveGastos();
}

function delGasto(id){
  if(!confirm('¿Eliminar este gasto?')) return;
  ST.gastos = ST.gastos.filter(g=>g.id!==id);
  saveGastos();
}

async function saveGastos(){
  setSt('load','↻ guardando...');
  try{
    const payload = {__personas: PERSONAS, __gastos: ST.gastos};
    await apiPost({action:'saveTarifas', tarifas:payload});
    setSt('ok','⬤ guardado'); render();
  } catch(e){ setSt('err','⬤ error'); alert('Error: '+e.message); }
}

// ── CONFIG ────────────────────────────────────────────────────────────────
function rConfig(){
  const url = ST.url;
  const personas = Object.entries(PERSONAS).sort(([a],[b])=>a.localeCompare(b));
  const rolesOpts = ['COORD','OPERADOR','PERIO'];
  const responsables = ['', ...Object.keys(PERSONAS).sort()];

  const persTable = personas.length ? `
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="background:#F7F8FA">
        <th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--border)">Nombre</th>
        <th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--border)">Rol</th>
        <th style="padding:8px 10px;text-align:right;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--border)">Monto</th>
        <th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);border-bottom:1px solid var(--border)">Paga a</th>
        <th style="padding:8px 10px;border-bottom:1px solid var(--border)"></th>
      </tr></thead>
      <tbody>${personas.map(([nombre,p])=>`<tr style="border-bottom:1px solid var(--border)">
        <td style="padding:8px 10px;font-weight:600">${nombre}</td>
        <td style="padding:8px 10px"><span class="badge ${p.rol==='COORD'?'b-masc':p.rol==='PERIO'?'b-fem':''}" style="font-size:10px">${p.rol}</span></td>
        <td style="padding:8px 10px;text-align:right;font-feature-settings:'tnum';font-weight:600;color:var(--pri)">${fmt(p.monto)}</td>
        <td style="padding:8px 10px;color:var(--t2)">${p.pagaA===nombre?'—':p.pagaA}</td>
        <td style="padding:8px 10px;text-align:right"><button class="bd" onclick="delPersona('${nombre}')">✕</button></td>
      </tr>`).join('')}</tbody>
    </table>` : `<p style="color:var(--t3);font-size:13px;padding:16px 0">Sin personas cargadas aún.</p>`;

  main.innerHTML=`
  <div class="card" style="margin-bottom:16px">
    <div class="ch"><strong>Conexión Google Sheets</strong></div>
    <div class="cb">
      <p style="font-size:13px;color:var(--t2);margin-bottom:12px">URL del Apps Script de Venezuela.</p>
      <div style="display:flex;gap:8px">
        <input id="url-inp" type="text" value="${url}" placeholder="https://script.google.com/macros/s/..." style="flex:1">
        <button class="btn bp" onclick="saveUrl()">Guardar URL</button>
      </div>
    </div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="ch"><strong>Directorio de personas</strong><span style="font-size:12px;color:var(--t3)">tarifas y responsables de pago</span></div>
    <div class="cb">
      ${persTable}
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
        <label style="margin-bottom:12px">Agregar persona</label>
        <div style="display:grid;grid-template-columns:1fr 130px 130px 160px auto;gap:8px;align-items:end">
          <div><label>Nombre</label><input id="np-nombre" placeholder="EDGAR" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"></div>
          <div><label>Rol</label><select id="np-rol">${rolesOpts.map(r=>`<option>${r}</option>`).join('')}</select></div>
          <div><label>Monto default</label><input id="np-monto" type="text" inputmode="numeric" placeholder="120" oninput="onMoney(this)"></div>
          <div><label>Paga a</label><select id="np-pagaA">
            <option value="">— mismo —</option>
            ${Object.keys(PERSONAS).sort().map(n=>`<option value="${n}">${n}</option>`).join('')}
          </select></div>
          <button class="btn bp" onclick="addPersona()" style="white-space:nowrap">+ Agregar</button>
        </div>
      </div>
      <div style="margin-top:14px;text-align:right">
        <button class="btn bp" onclick="savePersonas()">💾 Guardar directorio</button>
      </div>
    </div>
  </div>`;
}

function saveUrl(){
  const v = document.getElementById('url-inp')?.value.trim();
  if(!v){ alert('Pegá la URL del Apps Script.'); return; }
  ST.url=v; localStorage.setItem('gasUrlVzla',v);
  alert('URL guardada. Cargando datos...'); loadData();
}

function addPersona(){
  const nombre = (document.getElementById('np-nombre')?.value||'').trim().toUpperCase();
  const rol = document.getElementById('np-rol')?.value||'OPERADOR';
  const monto = parseI(document.getElementById('np-monto')?.value||'0');
  const pagaAEl = document.getElementById('np-pagaA')?.value;
  const pagaA = pagaAEl || nombre;
  if(!nombre){ alert('Ingresá el nombre.'); return; }
  if(PERSONAS[nombre]){ alert('Ya existe.'); return; }
  PERSONAS[nombre] = {monto, rol, pagaA};
  render();
}

function delPersona(nombre){
  if(!confirm(`¿Eliminar a ${nombre}?`)) return;
  delete PERSONAS[nombre];
  render();
}

async function savePersonas(){
  setSt('load','↻ guardando...');
  try{
    const payload = {__personas: PERSONAS, __gastos: ST.gastos};
    await apiPost({action:'saveTarifas', tarifas:payload});
    setSt('ok','⬤ guardado'); alert('Directorio guardado.');
  } catch(e){ setSt('err','⬤ error'); alert('Error: '+e.message); }
}

// ── UTILS ─────────────────────────────────────────────────────────────────
function noUrl(){
  return `<div class="empty"><h3>Primero configurá la conexión</h3><p>Ir a <strong>Config</strong> y pegá la URL del Apps Script.</p><br><button class="btn bp" onclick="goTab('config')">Ir a Config →</button></div>`;
}

loadData();
</script>
